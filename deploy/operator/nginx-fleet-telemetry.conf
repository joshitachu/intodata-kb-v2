    # --- Fleet heartbeat ingress (operator host only; ADR-039) ------------------
    #
    # Lets client instances deliver their heartbeat to the central Mission
    # Control: POST /ops/clients/<slug>/telemetry, and NOTHING else. Every other
    # Mission Control route (/ops/fleet, licences, triggers, snapshots) and the
    # dashboard's /mc/ proxy stay unreachable from the internet.
    #
    # Mission Control authenticates each request itself: the slug's own
    # telemetry key (issued in the Fleet screen), or the legacy shared
    # MC_API_KEY. A client key only works for its own slug.
    #
    # Standalone use (a host not deployed with deploy-client.sh): copy this file
    # to /etc/nginx/snippets/nexus-fleet-telemetry.conf, change 9100 below if
    # Mission Control is published on another loopback port, and add
    #     include /etc/nginx/snippets/nexus-fleet-telemetry.conf;
    # inside the HTTPS server block of the host named in MC_PUBLIC_URL. Then
    # nginx -t and reload. deploy-client.sh --fleet-host renders this same file
    # into the client server block (it rewrites the port).
    #
    # proxy_pass forwards the raw request URI, so only the exact form may pass:
    # dot segments, encoded slashes, query strings and anything else are 400
    # before nginx and the app could interpret the path differently. `return`
    # is safe inside `if`. The slug rule mirrors SLUG_PATTERN in
    # mission_control/fleet.py.
    location ~ "^/ops/clients/[a-z0-9][a-z0-9-]{0,62}/telemetry$" {
        if ($request_uri !~ "^/ops/clients/[a-z0-9][a-z0-9-]{0,62}/telemetry$") {
            return 400;
        }
        limit_except POST {
            deny all;
        }
        client_max_body_size 512k;
        proxy_pass http://127.0.0.1:9100$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 15s;
        proxy_read_timeout 15s;
    }
