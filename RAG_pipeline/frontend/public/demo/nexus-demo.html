<!--
  Nexus product demo — animated 16:9 sequence, ~48 seconds, 10 scenes.

  Self-contained: no build step, no dependencies, no network calls.
  Serve it or open it directly. The auth middleware lets any path containing
  a dot through, so http://localhost:3000/demo/nexus-demo.html needs no login.

    ?clean=1    hide the controls (use this when screen-recording)
    ?scene=N    hold a single scene, 1-10 (use this when re-shooting a beat)
    Space       play / pause          R   replay

  Copy, numbers, system names, the document list, the pack contents and the
  chat exchanges all live in the CONFIG block in the <script> below. The
  markup is only scaffolding — edit CONFIG, not the HTML.
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Nexus — product demo</title>
<style>
/* ------------------------------------------------------------------ tokens */
:root {
  /* Official Intodata palette */
  --navy:   #001e4d;
  --orange: #fe9543;
  --purple: #6370b0;
  --green:  #a0e06f;
  --light:  #ebebed;

  /* UI greys, matched to the app's shadcn tokens */
  --ink:     #0b1220;
  --muted:   #64748b;
  --faint:   #94a3b8;
  --line:    #e2e8f0;
  --surface: #ffffff;
  --canvas:  #f8fafc;
  --red:     #dc2626;

  --font-head: 'Massilia Bold', 'Segoe UI Semibold', 'Segoe UI', -apple-system,
               BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
  --font-body: 'Massilia Light', 'Segoe UI', -apple-system, BlinkMacSystemFont,
               'Helvetica Neue', Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;

  --e-sm: 0 1px 2px 0 hsl(224 20% 12% / .05), 0 1px 3px 0 hsl(224 20% 12% / .04);
  --e-md: 0 2px 4px -1px hsl(224 20% 12% / .06), 0 4px 8px -2px hsl(224 20% 12% / .06);
  --e-lg: 0 4px 6px -2px hsl(224 20% 12% / .05), 0 10px 20px -4px hsl(224 20% 12% / .08);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  height: 100%; background: #05080f; overflow: hidden;
  font-family: var(--font-body); -webkit-font-smoothing: antialiased;
}

/* ------------------------------------------------------------------- stage */
/* Column layout: the stage gets its own row and the controls get another, so
   the control bar can never sit on top of a scene's caption. */
#viewport { position: fixed; inset: 0; display: flex; flex-direction: column; }
/* Explicit centring, not grid/flex `center`: those clamp an oversized child to
   the start edge, which pushed the right side of the stage off screen. */
#stagearea { flex: 1; min-height: 0; position: relative; overflow: hidden; }
#stage {
  position: absolute; left: 50%; top: 50%; margin: -450px 0 0 -800px;
  width: 1600px; height: 900px;
  background: var(--navy);          /* matches scene 1 — nothing pale to dip through */
  overflow: hidden; transform-origin: center center;
}

/* Scenes stack in playback order, so the incoming scene always paints above
   the outgoing one. It fades in on top; the one beneath is torn down only
   once the new scene is fully opaque (see showScene). */
.scene {
  position: absolute; inset: 0;
  opacity: 0; visibility: hidden;
  transition: opacity .38s ease;
}
.scene.play, .scene.hold { opacity: 1; visibility: visible; }
.scene--dark { background: var(--navy); color: var(--light); }
.scene--soft { background: var(--canvas); color: var(--ink); }

/* -------------------------------------------------------------- type ramp */
.kicker {
  font-family: var(--font-head); font-size: 12.5px; font-weight: 700;
  letter-spacing: .16em; text-transform: uppercase; color: var(--orange);
}
.h1  { font-family: var(--font-head); font-weight: 700; font-size: 66px; line-height: 1.06; letter-spacing: -.02em; }
.h2  { font-family: var(--font-head); font-weight: 700; font-size: 40px; line-height: 1.1;  letter-spacing: -.015em; color: var(--navy); }
.h3  { font-family: var(--font-head); font-weight: 700; font-size: 23px; line-height: 1.2; }

.pagehead { position: absolute; left: 64px; top: 60px; max-width: 1000px; }
.pagehead .kicker { margin-bottom: 12px; }

/* ------------------------------------------------------------ lower third */
.lower { position: absolute; left: 64px; bottom: 40px; max-width: 900px; opacity: 0; }
.lower .kicker { margin-bottom: 8px; }
.lower .h3 { color: var(--navy); }
/* the caption lands after its scene's main action has resolved */
.scene.play .lower { animation: rise .55s cubic-bezier(.16,1,.3,1) both; }
.scene.play#s2  .lower { animation-delay: 2.6s; }
.scene.play#s3  .lower { animation-delay: 2.2s; }
.scene.play#s4  .lower { animation-delay: 3.2s; }
.scene.play#s5  .lower { animation-delay: 4.2s; }
.scene.play#s6  .lower { animation-delay: 2.2s; }
.scene.play#s6b .lower { animation-delay: 4.8s; }
.scene.play#s7  .lower { animation-delay: 2.2s; }
.scene.play#s8  .lower { animation-delay: 3.6s; }
.scene.play#s9  .lower { animation-delay: 4.4s; }

/* -------------------------------------------------------- app chrome mock */
.app { position: absolute; inset: 0; display: flex; background: var(--surface); }
.rail {
  width: 56px; flex: none; border-right: 1px solid var(--line); background: var(--surface);
  display: flex; flex-direction: column; align-items: center; padding: 12px 0; gap: 6px;
}
.rail .logo { display: block; line-height: 0; margin-bottom: 10px; }
.rail .ico { width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; color: var(--faint); }
.rail .ico svg { width: 17px; height: 17px; }
.rail .ico.on { background: var(--light); color: var(--navy); }

.pane { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.pane-top {
  height: 58px; flex: none; border-bottom: 1px solid var(--line);
  display: flex; align-items: center; gap: 13px; padding: 0 26px;
}
.pane-top .t { font-family: var(--font-head); font-weight: 700; font-size: 20px; color: var(--navy); }
.pane-top .sub2 { font-size: 13px; color: var(--muted); }
.pane-top .spacer { flex: 1; }
.pane-top .pill { padding: 5px 13px; border-radius: 999px; border: 1.5px solid var(--orange); font-size: 13.5px; color: var(--navy); }
.pane-top .chipflat {
  padding: 5px 12px; border-radius: 8px; background: var(--light); color: var(--navy);
  font-family: var(--font-head); font-weight: 700; font-size: 11px; letter-spacing: .09em;
}
/* bottom padding leaves room for the lower-third caption */
.pane-body { flex: 1; min-height: 0; padding: 18px 26px 112px; overflow: hidden; }

/* generic card */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--e-sm); }
.btn-navy {
  height: 46px; border-radius: 10px; background: var(--navy); color: var(--light);
  display: flex; align-items: center; justify-content: center; gap: 10px;
  font-family: var(--font-head); font-weight: 700; font-size: 15.5px; box-shadow: var(--e-md);
}
.btn-navy svg { width: 16px; height: 16px; }

/* =================================================================== S1 */
#s1 { display: grid; place-items: center; }
#s1 .wrap { text-align: center; max-width: 1120px; }
#s1 .h1 { color: var(--light); }
#s1 .h1 .dim { color: rgba(235,235,237,.4); display: block; margin-top: 12px; }
#s1 .rule { width: 0; height: 2px; margin: 40px auto 0; background: linear-gradient(90deg, var(--orange), rgba(254,149,67,0)); }
.scene.play#s1 .l1   { animation: rise .7s cubic-bezier(.16,1,.3,1) .25s both; }
.scene.play#s1 .l2   { animation: rise .7s cubic-bezier(.16,1,.3,1) 1.05s both; }
.scene.play#s1 .rule { animation: grow 1.2s cubic-bezier(.16,1,.3,1) 1.75s both; }

/* =================================================================== S2  connect GitHub */
#s2 .grid2 { display: grid; grid-template-columns: 430px 1fr; gap: 26px; height: 100%; }
#s2 .ghbtn {
  display: flex; align-items: center; gap: 11px; padding: 15px 18px;
  border-radius: 11px; background: var(--ink); color: #fff;
  font-family: var(--font-head); font-weight: 700; font-size: 16px;
  box-shadow: var(--e-md); opacity: 0;
}
#s2 .ghbtn svg { width: 21px; height: 21px; flex: none; }
.scene.play#s2 .ghbtn { animation: rise .5s cubic-bezier(.16,1,.3,1) .2s both; }

#s2 .field { margin-top: 22px; opacity: 0; }
#s2 .field .lbl { font-size: 12.5px; color: var(--muted); margin-bottom: 7px; }
#s2 .field .inp {
  height: 42px; border: 1px solid var(--line); border-radius: 9px;
  display: flex; align-items: center; padding: 0 13px; gap: 9px;
  font-size: 15px; color: var(--ink); background: var(--surface);
}
#s2 .field .inp .caret { width: 2px; height: 18px; background: var(--orange); }
#s2 .field .inp .chev { margin-left: auto; color: var(--faint); }
.scene.play#s2 .f1 { animation: rise .5s cubic-bezier(.16,1,.3,1) .7s both; }
.scene.play#s2 .f2 { animation: rise .5s cubic-bezier(.16,1,.3,1) .9s both; }

#s2 .repos { padding: 6px; }
#s2 .repohead {
  display: flex; align-items: center; gap: 9px; padding: 11px 13px 12px;
  font-size: 12.5px; color: var(--muted); border-bottom: 1px solid var(--line);
}
#s2 .repo {
  display: flex; align-items: center; gap: 12px; padding: 11px 13px;
  border-radius: 8px; opacity: 0;
}
#s2 .repo .box {
  width: 18px; height: 18px; border-radius: 5px; border: 1.5px solid var(--line);
  flex: none; display: grid; place-items: center; background: var(--surface);
}
#s2 .repo .box svg { width: 11px; height: 11px; color: #fff; opacity: 0; }
#s2 .repo .nm { font-family: var(--mono); font-size: 14px; color: var(--ink); }
#s2 .repo .tag {
  margin-left: auto; font-size: 11px; padding: 2px 7px; border-radius: 5px;
  background: var(--light); color: var(--muted); font-family: var(--font-head); font-weight: 700;
}
#s2 .repo.pick .box { background: var(--navy); border-color: var(--navy); }
#s2 .repo.pick .box svg { opacity: 1; }
.scene.play#s2 .repo { animation: rowIn .4s cubic-bezier(.16,1,.3,1) both; }
.scene.play#s2 .repo.pick { animation: rowIn .4s cubic-bezier(.16,1,.3,1) both, tickBg .35s ease-out both; }

#s2 .import { margin-top: 18px; opacity: 0; }
.scene.play#s2 .import { animation: rise .5s cubic-bezier(.16,1,.3,1) 3.1s both; }

/* =================================================================== S3  connectors */
#s3 .field { position: relative; height: 470px; margin-top: 34px; }
#s3 .dock {
  position: absolute; left: 50%; top: 50%; width: 234px; height: 234px;
  border-radius: 26px; background: var(--navy); box-shadow: var(--e-lg);
  display: grid; place-content: center; justify-items: center; gap: 6px;
  opacity: 0;
}
#s3 .dock .name { font-family: var(--font-head); font-weight: 700; font-size: 29px; color: var(--light); }
#s3 .dock .meta { font-size: 12px; color: rgba(235,235,237,.5); }
#s3 .dock .halo { position: absolute; inset: -20px; border-radius: 34px; border: 1.5px solid rgba(254,149,67,.3); opacity: 0; }
.scene.play#s3 .dock { animation: dockPop .6s cubic-bezier(.16,1,.3,1) .2s both; }
.scene.play#s3 .dock .halo { animation: halo 2.4s ease-out 1.4s infinite; }

#s3 .chip {
  position: absolute; display: flex; align-items: center; gap: 10px;
  padding: 11px 16px; background: var(--surface); border: 1px solid var(--line);
  border-radius: 11px; box-shadow: var(--e-md); font-size: 15.5px; color: var(--ink);
  white-space: nowrap; opacity: 0;
}
#s3 .chip .dotmark { width: 8px; height: 8px; border-radius: 3px; flex: none; }
#s3 .chip .tick {
  width: 17px; height: 17px; border-radius: 50%; background: var(--green);
  display: grid; place-items: center; transform: scale(0);
}
#s3 .chip .tick svg { width: 10px; height: 10px; }
#s3 .chip .note { font-size: 11.5px; color: var(--faint); }
.scene.play#s3 .chip { animation: flyIn .75s cubic-bezier(.16,1,.3,1) both; }
.scene.play#s3 .chip .tick { animation: pop .3s cubic-bezier(.34,1.56,.64,1) both; }

#s3 svg.threads { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
#s3 .thread { fill: none; stroke: var(--purple); stroke-width: 1.4; stroke-dasharray: 4 5; opacity: .45; stroke-dashoffset: 300; }
.scene.play#s3 .thread { animation: dash 1s linear both; }

/* =================================================================== S4  scan code */
#s4 .split { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; height: 470px; margin-top: 30px; }

#s4 .codebox {
  background: var(--navy); border-radius: 13px; padding: 18px 20px;
  overflow: hidden; box-shadow: var(--e-lg); position: relative; opacity: 0;
}
.scene.play#s4 .codebox { animation: rise .5s cubic-bezier(.16,1,.3,1) .15s both; }
#s4 .codebox .fname {
  font-family: var(--mono); font-size: 12px; color: rgba(235,235,237,.45);
  padding-bottom: 12px; border-bottom: 1px solid rgba(235,235,237,.1); margin-bottom: 12px;
}
#s4 .code { font-family: var(--mono); font-size: 12.5px; line-height: 1.85; white-space: pre; }
#s4 .code .cl { display: block; color: rgba(235,235,237,.42); opacity: 0; }
#s4 .code .tg { color: var(--purple); }
#s4 .code .at { color: #9fb4e8; }
#s4 .code .st { color: var(--green); }
#s4 .code .hl { background: rgba(254,149,67,.16); box-shadow: -6px 0 0 rgba(254,149,67,.16), 6px 0 0 rgba(254,149,67,.16); }
.scene.play#s4 .code .cl { animation: logIn .3s ease-out both; }

#s4 .facts { display: flex; flex-direction: column; gap: 9px; }
#s4 .fact {
  display: flex; align-items: center; gap: 12px; padding: 12px 15px;
  background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--purple);
  border-radius: 9px; box-shadow: var(--e-sm); opacity: 0;
}
#s4 .fact .k {
  font-family: var(--font-head); font-weight: 700; font-size: 9.5px; letter-spacing: .11em;
  color: var(--purple); width: 78px; flex: none;
}
#s4 .fact .v { font-family: var(--mono); font-size: 13px; color: var(--ink); }
#s4 .fact.rt { border-left-color: var(--orange); }
#s4 .fact.rt .k { color: var(--orange); }
.scene.play#s4 .fact { animation: rowIn .45s cubic-bezier(.16,1,.3,1) both; }

/* =================================================================== S5  packs */
#s5 .wb { display: grid; grid-template-columns: 250px 1fr 300px; gap: 20px; height: 100%; }
#s5 .col { display: flex; flex-direction: column; gap: 9px; }
#s5 .coltitle {
  font-family: var(--font-head); font-weight: 700; font-size: 11px; letter-spacing: .12em;
  color: var(--faint); margin-bottom: 3px;
}
#s5 .packitem {
  padding: 11px 13px; border-radius: 9px; border: 1px solid var(--line);
  background: var(--surface); font-size: 14px; color: var(--ink); opacity: 0;
}
#s5 .packitem .d { font-size: 11.5px; color: var(--muted); margin-top: 3px; }
#s5 .packitem.on { border-color: var(--navy); border-left: 3px solid var(--orange); box-shadow: var(--e-sm); }
.scene.play#s5 .packitem { animation: rowIn .4s cubic-bezier(.16,1,.3,1) both; }

#s5 .doccard { padding: 15px 17px; border-radius: 11px; border: 1px solid var(--line); background: var(--surface); box-shadow: var(--e-sm); opacity: 0; }
#s5 .doccard .nm { font-family: var(--mono); font-size: 13.5px; color: var(--navy); }
#s5 .doccard .secs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
#s5 .doccard .sec {
  font-size: 11.5px; padding: 4px 9px; border-radius: 6px;
  background: var(--canvas); border: 1px solid var(--line); color: var(--muted);
}
#s5 .doccard .sec.add { border-color: var(--green); background: rgba(160,224,111,.16); color: #3f6b16; opacity: 0; }
.scene.play#s5 .doccard { animation: rise .45s cubic-bezier(.16,1,.3,1) both; }
.scene.play#s5 .doccard .sec.add { animation: pop .35s cubic-bezier(.34,1.56,.64,1) both; }

#s5 .instr { margin-top: 12px; opacity: 0; }
#s5 .instr .lbl { font-size: 11.5px; color: var(--muted); margin-bottom: 6px; }
#s5 .instr .ta {
  border: 1px solid var(--line); border-radius: 9px; padding: 11px 13px;
  font-size: 13.5px; line-height: 1.5; color: var(--ink); min-height: 74px; background: var(--surface);
}
#s5 .instr .ta .caret { display: inline-block; width: 2px; height: 15px; background: var(--orange); vertical-align: -2px; }
.scene.play#s5 .instr { animation: rise .45s cubic-bezier(.16,1,.3,1) 1.5s both; }

#s5 .side { display: flex; flex-direction: column; gap: 10px; }
#s5 .status {
  display: flex; align-items: center; gap: 9px; padding: 12px 14px; border-radius: 9px;
  background: rgba(160,224,111,.14); border: 1px solid rgba(160,224,111,.5);
  font-size: 13.5px; color: #3f6b16; font-family: var(--font-head); font-weight: 700; opacity: 0;
}
#s5 .status svg { width: 15px; height: 15px; flex: none; }
#s5 .aibtn {
  display: flex; align-items: center; gap: 9px; padding: 12px 14px; border-radius: 9px;
  border: 1px solid var(--line); background: var(--surface); font-size: 13.5px; color: var(--navy); opacity: 0;
}
#s5 .aibtn svg { width: 15px; height: 15px; color: var(--purple); }
.scene.play#s5 .aibtn  { animation: rise .4s cubic-bezier(.16,1,.3,1) 2.6s both; }
.scene.play#s5 .status { animation: rise .4s cubic-bezier(.16,1,.3,1) 3.4s both; }
.scene.play#s5 .usebtn { animation: rise .45s cubic-bezier(.16,1,.3,1) 3.8s both; opacity: 0; }

/* =================================================================== S6  docs */
#s6 .rows { margin-top: 12px; }
#s6 .row {
  display: flex; align-items: center; gap: 13px; height: 41px;
  border-bottom: 1px solid var(--line); opacity: 0;
}
#s6 .row .fi { width: 16px; height: 16px; color: var(--purple); flex: none; }
#s6 .row .nm { font-family: var(--mono); font-size: 14.5px; color: var(--ink); }
#s6 .row .sz { font-size: 13px; color: var(--muted); }
#s6 .row .acts { margin-left: auto; display: flex; gap: 15px; color: var(--faint); }
#s6 .row .acts svg { width: 15px; height: 15px; }
#s6 .genbtn { opacity: 0; }
.scene.play#s6 .genbtn { animation: rise .45s cubic-bezier(.16,1,.3,1) .15s both; }
.scene.play#s6 .row { animation: rowIn .35s cubic-bezier(.16,1,.3,1) both; }
#s6 .lower { background: var(--surface); padding-right: 24px; }

/* =================================================================== S6b  inside a document */
#s6b .docwrap { display: grid; grid-template-columns: 190px 1fr; gap: 26px; height: 100%; }

#s6b .toc { display: flex; flex-direction: column; gap: 3px; padding-top: 4px; }
#s6b .toc .ti {
  font-size: 12.5px; padding: 6px 10px; border-radius: 7px; border-left: 2px solid transparent;
  color: var(--faint); transition: all .35s ease;
}
#s6b .toc .ti.on { color: var(--navy); border-left-color: var(--orange); background: var(--canvas); font-family: var(--font-head); font-weight: 700; }

/* Shorter than the document, so the scroll actually travels and the page is
   full at every point of the journey. */
#s6b .docpage {
  position: relative; align-self: start; height: 560px;
  overflow: hidden; border: 1px solid var(--line);
  border-radius: 12px; background: var(--surface); box-shadow: var(--e-sm); opacity: 0;
}
.scene.play#s6b .docpage { animation: rise .5s cubic-bezier(.16,1,.3,1) .15s both; }
#s6b .docpage::after,                        /* soften both cut edges of the page */
#s6b .docpage::before {
  content: ""; position: absolute; left: 0; right: 0; height: 52px;
  pointer-events: none; z-index: 2;
}
#s6b .docpage::after  { bottom: 0; background: linear-gradient(0deg,  #fff, rgba(255,255,255,0)); }
#s6b .docpage::before { top: 0;    background: linear-gradient(180deg, #fff, rgba(255,255,255,0)); }
/* generous bottom padding keeps the last table row clear of the bottom fade
   once the scroll reaches the end */
#s6b .docscroll { padding: 26px 32px 78px; will-change: transform; }
.scene.play#s6b .docscroll { animation: scrollDoc 5.6s cubic-bezier(.4,0,.5,1) .8s both; }

/* markdown-ish prose */
#s6b .prose h1 { font-family: var(--font-head); font-weight: 700; font-size: 26px; color: var(--navy); }
#s6b .prose h2 {
  font-family: var(--font-head); font-weight: 700; font-size: 17px; color: var(--navy);
  margin: 22px 0 10px; padding-bottom: 7px; border-bottom: 1px solid var(--line);
}
#s6b .prose h3 { font-family: var(--font-head); font-weight: 700; font-size: 14.5px; color: var(--ink); margin: 16px 0 8px; }
#s6b .prose p  { font-size: 13px; line-height: 1.6; color: var(--ink); margin: 6px 0; }
#s6b .prose p b { color: var(--navy); }
#s6b .prose code {
  font-family: var(--mono); font-size: 12px; background: var(--canvas);
  border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px; color: var(--purple);
}
#s6b .prose table { width: 100%; border-collapse: collapse; margin: 10px 0 4px; }
#s6b .prose th {
  font-family: var(--font-head); font-weight: 700; font-size: 10.5px; letter-spacing: .05em;
  text-transform: uppercase; color: var(--muted); text-align: left;
  padding: 7px 9px; border-bottom: 1.5px solid var(--line); background: var(--canvas);
}
#s6b .prose td {
  font-size: 11.5px; padding: 7px 9px; border-bottom: 1px solid var(--line);
  color: var(--ink); vertical-align: top;
}
#s6b .prose td.m { font-family: var(--mono); font-size: 11px; }
#s6b .prose .cf {
  font-family: var(--font-head); font-weight: 700; font-size: 9.5px; letter-spacing: .06em;
  padding: 2px 7px; border-radius: 5px; background: rgba(160,224,111,.24); color: #3f6b16;
}
#s6b .prose .cf.med { background: rgba(254,149,67,.2); color: #8a4a06; }
#s6b .prose pre {
  background: var(--navy); border-radius: 9px; padding: 15px 17px; margin: 10px 0 4px;
  overflow: hidden;
}
#s6b .prose pre code {
  display: block; background: none; border: none; padding: 0;
  font-size: 11.5px; line-height: 1.75; color: rgba(235,235,237,.75); white-space: pre;
}
#s6b .prose pre .kw { color: var(--orange); }
#s6b .prose pre .fn { color: #9fb4e8; }
#s6b .prose pre .st { color: var(--green); }

/* ======================================================== S7/S9 topology */
.topocanvas { position: relative; width: 1400px; height: 470px; }
.topocanvas .colhead {
  position: absolute; top: 0; font-family: var(--font-head); font-weight: 700;
  font-size: 11.5px; letter-spacing: .14em; color: var(--purple); opacity: 0;
}
.topocanvas .node {
  position: absolute; width: 234px; background: var(--surface);
  border: 1px solid var(--line); border-left: 3px solid var(--purple);
  border-radius: 10px; padding: 10px 13px 11px; box-shadow: var(--e-sm); opacity: 0;
}
.topocanvas .node .k { font-family: var(--font-head); font-weight: 700; font-size: 9px; letter-spacing: .12em; color: var(--purple); }
.topocanvas .node .n { font-family: var(--font-head); font-weight: 700; font-size: 14.5px; color: var(--navy); margin-top: 3px; }
.topocanvas .node .d {
  font-size: 11px; line-height: 1.35; color: var(--muted); margin-top: 4px;
  overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
}
.topocanvas .node .b {
  display: inline-block; margin-top: 6px; padding: 2px 7px; border-radius: 5px;
  font-size: 9px; font-family: var(--font-head); font-weight: 700;
  background: rgba(160,224,111,.22); color: #3f6b16;
}
.topocanvas .node .b.warn { background: rgba(254,149,67,.2); color: #8a4a06; }
.topocanvas .node.core { background: var(--navy); border-color: var(--navy); border-left-color: var(--orange); box-shadow: var(--e-lg); }
.topocanvas .node.core .k { color: var(--orange); }
.topocanvas .node.core .n { color: var(--light); font-size: 15.5px; }
.topocanvas .node.core .d { color: rgba(235,235,237,.6); }
.topocanvas .node.core .b { background: rgba(160,224,111,.2); color: var(--green); }
.topocanvas svg.wires { position: absolute; inset: 0; width: 1400px; height: 470px; overflow: visible; }
.topocanvas .wire { fill: none; stroke: var(--purple); stroke-width: 1.4; stroke-dasharray: 900; stroke-dashoffset: 900; opacity: .5; }

.scene.play .topocanvas .colhead { animation: fade .4s ease-out both; }
.scene.play .topocanvas .node    { animation: nodeIn .45s cubic-bezier(.16,1,.3,1) both; }
.scene.play .topocanvas .wire    { animation: draw .75s ease-out both; }

#s7 .lower { background: linear-gradient(90deg, rgba(255,255,255,.97) 62%, rgba(255,255,255,0)); padding-right: 40px; }

/* =================================================================== S8  drill down */
#s8 .crumb { display: flex; align-items: center; gap: 8px; font-size: 13px; }
#s8 .crumb .c { color: var(--muted); opacity: 0; }
#s8 .crumb .c.here { color: var(--navy); font-family: var(--font-head); font-weight: 700; }
#s8 .crumb .sep { color: var(--faint); opacity: 0; }
.scene.play#s8 .crumb .c, .scene.play#s8 .crumb .sep { animation: fade .35s ease-out both; }

#s8 .split { display: grid; grid-template-columns: 1fr 320px; gap: 22px; height: 100%; }
/* fixed size so the SVG coordinate system matches the node pixel positions —
   a stretched viewBox pulls the lineage edges off the nodes */
#s8 .chain { position: relative; width: 1000px; height: 420px; }
#s8 .jn {
  position: absolute; width: 168px; padding: 11px 13px; border-radius: 10px;
  background: var(--surface); border: 1px solid var(--line); box-shadow: var(--e-sm); opacity: 0;
}
#s8 .jn .kk { font-family: var(--mono); font-size: 10px; color: var(--purple); }
#s8 .jn .nn { font-family: var(--font-head); font-weight: 700; font-size: 14px; color: var(--navy); margin-top: 3px; }
#s8 .jn .dd { font-size: 10.5px; color: var(--muted); margin-top: 3px; }
#s8 .jn.fail { border-color: var(--orange); border-width: 1.5px; background: #fff8f1; }
#s8 .jn.fail .nn { color: #8a4a06; }
#s8 .jn.dimmed { opacity: .28 !important; }
.scene.play#s8 .jn { animation: nodeIn .4s cubic-bezier(.16,1,.3,1) both; }

#s8 svg.lin { position: absolute; left: 0; top: 0; width: 1000px; height: 420px; overflow: visible; }
#s8 .lw { fill: none; stroke: var(--purple); stroke-width: 1.5; stroke-dasharray: 400; stroke-dashoffset: 400; opacity: .5; }
#s8 .lw.hot { stroke: var(--orange); stroke-width: 2.2; opacity: .95; }
.scene.play#s8 .lw { animation: draw .6s ease-out both; }

#s8 .inspector {
  border-left: 1px solid var(--line); padding-left: 20px;
  display: flex; flex-direction: column; gap: 12px; opacity: 0;
}
.scene.play#s8 .inspector { animation: slideL .5s cubic-bezier(.16,1,.3,1) 2.5s both; }
#s8 .inspector .ih { font-family: var(--font-head); font-weight: 700; font-size: 15px; color: var(--navy); }
#s8 .inspector .kv { display: flex; justify-content: space-between; gap: 10px; font-size: 12.5px; padding: 6px 0; border-bottom: 1px solid var(--line); }
#s8 .inspector .kv span:first-child { color: var(--muted); }
#s8 .inspector .kv span:last-child { font-family: var(--mono); color: var(--ink); }
#s8 .inspector .fl { font-family: var(--mono); font-size: 11.5px; color: var(--ink); padding: 5px 0; opacity: 0; }
#s8 .inspector .fl i { color: var(--orange); font-style: normal; }
.scene.play#s8 .inspector .fl { animation: rowIn .35s ease-out both; }
#s8 .inspector .rt {
  margin-top: 10px; padding: 11px 13px; border-radius: 9px;
  background: #fff8f1; border: 1px solid rgba(254,149,67,.5); font-size: 12.5px; color: #8a4a06;
}

/* =================================================================== S9  ask on page */
#s9 .withrail { display: flex; height: 100%; gap: 0; }
#s9 .left { flex: 1; min-width: 0; overflow: hidden; }
#s9 .topocanvas { transform: scale(.74); transform-origin: top left; }
#s9 .rail2 {
  width: 344px; flex: none; border-left: 1px solid var(--line);
  padding: 0 0 0 20px; display: flex; flex-direction: column; gap: 12px;
}
#s9 .rail2 .rh { display: flex; align-items: center; gap: 8px; font-family: var(--font-head); font-weight: 700; font-size: 15px; color: var(--navy); }
#s9 .rail2 .rh svg { width: 15px; height: 15px; }
#s9 .rail2 .scope {
  align-self: flex-start; display: flex; align-items: center; gap: 6px;
  padding: 4px 10px; border-radius: 999px; background: var(--light);
  font-size: 11.5px; color: var(--navy); font-family: var(--font-head); font-weight: 700;
}
#s9 .rail2 .hint { font-size: 12.5px; line-height: 1.5; color: var(--muted); }
#s9 .rail2 .sug {
  padding: 10px 12px; border: 1px solid var(--line); border-radius: 9px;
  font-size: 12.5px; line-height: 1.4; color: var(--ink); background: var(--surface); opacity: 0;
}
.scene.play#s9 .rail2 .sug { animation: rowIn .35s ease-out both; }

#s9 .qbubble {
  align-self: flex-end; max-width: 300px; padding: 10px 13px; border-radius: 11px 11px 3px 11px;
  background: var(--navy); color: var(--light); font-size: 13.5px; line-height: 1.45; opacity: 0;
}
#s9 .qbubble .caret { display: inline-block; width: 2px; height: 14px; background: var(--orange); vertical-align: -2px; }
#s9 .abubble {
  padding: 12px 14px; border-radius: 11px 11px 11px 3px; background: var(--canvas);
  border: 1px solid var(--line); font-size: 13px; line-height: 1.55; color: var(--ink); opacity: 0;
}
#s9 .abubble .w { opacity: 0; }
#s9 .targets { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 11px; }
#s9 .targets .tg {
  display: flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 7px;
  background: var(--surface); border: 1px solid var(--purple); font-size: 11.5px;
  color: var(--navy); font-family: var(--mono); opacity: 0;
}
#s9 .targets .tg .sq { width: 6px; height: 6px; border-radius: 2px; background: var(--orange); }
.scene.play#s9 .targets .tg { animation: pop .35s cubic-bezier(.34,1.56,.64,1) both; }
#s9 .composer2 {
  margin-top: 14px; border: 1px solid var(--line); border-radius: 11px;
  padding: 11px 13px; display: flex; align-items: center; gap: 10px;
  font-size: 13px; color: var(--faint); background: var(--surface);
}
#s9 .composer2 .up { margin-left: auto; width: 26px; height: 26px; border-radius: 50%; background: var(--light); display: grid; place-items: center; color: var(--navy); }
#s9 .composer2 .up svg { width: 12px; height: 12px; }

/* nodes the answer points at get called out */
#s9 .topocanvas .node.tgt { border-color: var(--orange); border-left-color: var(--orange); box-shadow: 0 0 0 3px rgba(254,149,67,.16), var(--e-md); }

/* =================================================================== S10 */
#s10 { display: grid; place-items: center; }
#s10 .wrap { text-align: center; max-width: 1180px; }
#s10 .kicker { margin-bottom: 22px; opacity: 0; }
#s10 .h1 { color: var(--light); opacity: 0; }
#s10 .h1 em { font-style: normal; color: var(--orange); }
#s10 .logo { margin: 46px auto 0; opacity: 0; }
#s10 .tag { margin-top: 16px; font-size: 17px; letter-spacing: .06em; color: rgba(235,235,237,.5); opacity: 0; }
.scene.play#s10 .kicker { animation: fade .55s ease-out .15s both; }
.scene.play#s10 .h1     { animation: rise .7s cubic-bezier(.16,1,.3,1) .4s both; }
.scene.play#s10 .logo   { animation: rise .6s cubic-bezier(.16,1,.3,1) 1.2s both; }
.scene.play#s10 .tag    { animation: fade .6s ease-out 1.55s both; }

/* -------------------------------------------------------------- keyframes */
@keyframes rise    { from { opacity: 0; transform: translateY(22px); } to { opacity: 1; transform: none; } }
@keyframes slideL  { from { opacity: 0; transform: translateX(26px); } to { opacity: 1; transform: none; } }
@keyframes fade    { from { opacity: 0; } to { opacity: 1; } }
@keyframes grow    { from { width: 0; } to { width: var(--w, 100%); } }
@keyframes pop     { from { opacity: 0; transform: scale(.72); } to { opacity: 1; transform: scale(1); } }
@keyframes dash    { to { stroke-dashoffset: 0; } }
@keyframes draw    { to { stroke-dashoffset: 0; } }
@keyframes logIn   { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: none; } }
@keyframes rowIn   { from { opacity: 0; transform: translateX(-18px); } to { opacity: 1; transform: none; } }
@keyframes nodeIn  { from { opacity: 0; transform: translateY(12px) scale(.96); } to { opacity: 1; transform: none; } }
@keyframes halo    { 0% { opacity: .8; transform: scale(1); } 100% { opacity: 0; transform: scale(1.14); } }
@keyframes tickBg  { from { background: rgba(254,149,67,.14); } to { background: transparent; } }
@keyframes flyIn {
  from { opacity: 0; transform: translate(var(--fx), var(--fy)) scale(.88); }
  55%  { opacity: 1; }
  to   { opacity: 1; transform: none; }
}
@keyframes dockPop {
  from { opacity: 0; transform: translate(-50%,-50%) scale(.86); }
  to   { opacity: 1; transform: translate(-50%,-50%) scale(1); }
}
/* --scroll is set per-render from the document's actual overflow */
@keyframes scrollDoc {
  0%   { transform: translateY(0); }
  18%  { transform: translateY(0); }
  100% { transform: translateY(var(--scroll, -600px)); }
}

/* ----------------------------------------------------------------- cursor */
/* Sits above every scene so the viewer can see what is being clicked. */
#cursorlayer { position: absolute; inset: 0; pointer-events: none; z-index: 50; }

#cursor {
  position: absolute; left: 0; top: 0; width: 30px; height: 30px;
  opacity: 0; transition: opacity .25s ease;
  filter: drop-shadow(0 2px 5px rgba(0,30,77,.35));
}
#cursor.on { opacity: 1; }
#cursor.press { transform-origin: 20% 10%; }
#cursor svg { width: 100%; height: 100%; display: block; }

/* expanding ring at the click point */
.ripple {
  position: absolute; width: 18px; height: 18px; margin: -9px 0 0 -9px;
  border-radius: 50%; border: 2.5px solid var(--orange);
  animation: ripple .6s cubic-bezier(.2,.8,.3,1) forwards;
}
@keyframes ripple {
  from { opacity: .95; transform: scale(.35); }
  to   { opacity: 0;   transform: scale(3.4); }
}

/* the element being clicked gets a brief ring — box-shadow only, so it never
   fights with the transform-based entrance animations */
.clickflash {
  box-shadow: 0 0 0 3px rgba(254,149,67,.55), 0 0 0 6px rgba(254,149,67,.16) !important;
  transition: box-shadow .12s ease;
}

/* --------------------------------------------------------------- controls */
#ui {
  flex: none; padding: 13px 22px;
  display: flex; align-items: center; gap: 16px;
  background: #05080f; border-top: 1px solid rgba(235,235,237,.08);
  transition: opacity .35s ease;
}
#ui.hide { opacity: .18; }
body.clean #ui { display: none; }
#ui button {
  appearance: none; border: 1px solid rgba(235,235,237,.22);
  background: rgba(235,235,237,.06); color: var(--light);
  font-family: var(--font-head); font-weight: 700; font-size: 12px;
  letter-spacing: .1em; text-transform: uppercase; padding: 8px 15px;
  border-radius: 8px; cursor: pointer; transition: background .15s ease;
}
#ui button:hover { background: rgba(235,235,237,.15); }
#track { flex: 1; height: 3px; border-radius: 2px; background: rgba(235,235,237,.16); overflow: hidden; }
#fill { height: 100%; width: 0; background: var(--orange); }
#clock { font-family: var(--mono); font-size: 12px; color: rgba(235,235,237,.55); font-variant-numeric: tabular-nums; min-width: 84px; text-align: right; }
#label { font-family: var(--font-head); font-weight: 700; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: rgba(235,235,237,.4); min-width: 190px; }
</style>
</head>

/* Global pace. 1 = as authored, higher = slower. Scales scene durations, every
   JS-scheduled beat, the cursor's travel, and — via the Web Animations API —
   all the CSS keyframe delays and durations, so one number retimes the whole
   piece coherently. Override per-viewing with ?pace=1.4 to audition a speed. */
const PACE = (() => {
  const q = parseFloat(new URLSearchParams(location.search).get("pace"));
  return Number.isFinite(q) && q > 0.2 && q < 4 ? q : 1.2;
})();

const TOTAL = SCENES.reduce((a, s) => a + s.dur, 0) * PACE;

let sceneTimers = [];
/* every scheduled beat is expressed in authored time and stretched by PACE */
const later = (fn, ms) => sceneTimers.push(setTimeout(fn, ms * PACE));
function clearSceneTimers() { sceneTimers.forEach(clearTimeout); sceneTimers = []; }

function typeInto(node, text, startAt, speed, caret) {
  node.textContent = "";
  if (caret) caret.style.visibility = "visible";
  later(() => {
    let i = 0;
    const step = () => {
      node.textContent = text.slice(0, ++i);
      if (i < text.length) later(step, speed);
      else if (caret) later(() => { caret.style.visibility = "hidden"; }, 400);
    };
    step();
  }, startAt);
}

/* --------------------------------------------------------- cursor engine */
const cursorEl = $("#cursor"), cursorLayer = $("#cursorlayer");
const CURSOR_TIP = [6, 3];      // arrow tip offset inside the 30px box

/* Element centre in stage coordinates. The stage is transform-scaled, so
   client rects have to be divided back down by that scale. */
function centreOf(sel) {
  const node = $(sel);
  if (!node) return null;
  const s = $("#stage").getBoundingClientRect();
  const scale = s.width / 1600;
  if (!scale) return null;
  const r = node.getBoundingClientRect();
  return {
    x: (r.left - s.left) / scale + r.width / scale / 2,
    y: (r.top - s.top) / scale + r.height / scale / 2,
  };
}

function placeCursor(pt, ms) {
  cursorEl.style.transition = ms
    ? `opacity .25s ease, transform ${ms}ms cubic-bezier(.35,0,.2,1)`
    : "opacity .25s ease";
  cursorEl.style.transform = `translate(${pt.x - CURSOR_TIP[0]}px, ${pt.y - CURSOR_TIP[1]}px)`;
}

function clickAt(pt, sel) {
  const r = el("div", "ripple");
  r.style.left = pt.x + "px";
  r.style.top = pt.y + "px";
  cursorLayer.append(r);
  r.getAnimations().forEach(a => { a.playbackRate = 1 / PACE; });
  setTimeout(() => r.remove(), 700 * PACE);

  const node = $(sel);
  if (node) {
    node.classList.add("clickflash");
    setTimeout(() => node.classList.remove("clickflash"), 320);
  }
}

function runCursor(sceneId) {
  const track = CONFIG.cursor[sceneId];
  if (!track || !track.length) { cursorEl.classList.remove("on"); return; }

  // start just off the first target so the first hop reads as a move
  const first = centreOf(track[0].sel);
  if (!first) { cursorEl.classList.remove("on"); return; }
  placeCursor({ x: first.x - 150, y: first.y + 110 }, 0);
  cursorEl.classList.add("on");

  // Positions are measured at hop time, not up front: entrance animations use
  // `both` fill, so before a scene plays its elements sit at their `from`
  // offset and measuring early would aim the cursor a few pixels off.
  let prev = { x: first.x - 150, y: first.y + 110 };
  track.forEach(step => {
    later(() => {
      const to = centreOf(step.sel);
      if (!to) return;
      const dist = Math.hypot(to.x - prev.x, to.y - prev.y);
      const travel = Math.min(620, Math.max(200, dist * 1.05));
      prev = to;
      placeCursor(to, travel * PACE);        // real wall-clock transition
      if (step.click) later(() => clickAt(to, step.sel), travel + 40);
    }, step.at * 1000);
  });
}

/* ------------------------------------------------------------- playback */
const stage = $("#stage");
const ui = $("#ui"), fill = $("#fill"), clock = $("#clock"), label = $("#label");
const btnToggle = $("#toggle"), btnReplay = $("#replay");

let idx = -1, playing = false, elapsedBefore = 0, sceneStart = 0, nextTimer = 0;
let prevNode = null, teardown = 0;

function showScene(i) {
  clearSceneTimers();
  clearTimeout(teardown);
  resetSceneState();

  const sc = SCENES[i];
  const node = document.getElementById(sc.id);
  const outgoing = prevNode && prevNode !== node ? prevNode : null;

  // Hold the outgoing scene at full opacity underneath while the new one
  // fades in on top, then tear it down. Without this the stage background
  // shows through the middle of every transition.
  $$(".scene").forEach(s => {
    if (s !== node && s !== outgoing) s.classList.remove("play", "hold");
  });
  if (outgoing) { outgoing.classList.remove("play"); outgoing.classList.add("hold"); }

  void node.offsetWidth;                 // restart inner animations cleanly
  node.classList.remove("hold");
  node.classList.add("play");

  // Stretch every CSS keyframe animation in this scene by PACE. Reading a
  // computed style first forces the style recalc that creates them, so
  // getAnimations() actually returns something.
  if (PACE !== 1) {
    getComputedStyle(node).opacity;
    node.getAnimations({ subtree: true }).forEach(a => { a.playbackRate = 1 / PACE; });
  }

  if (outgoing) teardown = setTimeout(() => outgoing.classList.remove("hold"), 460 * PACE);

  prevNode = node;
  label.textContent = sc.label;
  if (sc.onPlay) sc.onPlay();
  runCursor(sc.id);
}

function playFrom(i) {
  idx = i;
  elapsedBefore = SCENES.slice(0, i).reduce((a, s) => a + s.dur, 0) * PACE;
  sceneStart = performance.now();
  showScene(i);
  clearTimeout(nextTimer);
  nextTimer = setTimeout(() => {
    if (i + 1 < SCENES.length) playFrom(i + 1);
    else halt(true);
  }, SCENES[i].dur * PACE);
}

function tick() {
  if (playing) {
    const e = Math.min(TOTAL, elapsedBefore + (performance.now() - sceneStart));
    fill.style.width = (e / TOTAL * 100) + "%";
    clock.textContent = (e / 1000).toFixed(1) + " / " + (TOTAL / 1000).toFixed(1) + "s";
  }
  requestAnimationFrame(tick);
}

function start() {
  playing = true;
  btnToggle.textContent = "Pause";
  playFrom(0);
  later(() => ui.classList.add("hide"), 1200);
}

function halt(finished) {
  playing = false;
  clearTimeout(nextTimer);
  clearSceneTimers();
  btnToggle.textContent = finished ? "Play" : "Resume";
  if (finished) {
    fill.style.width = "100%";
    clock.textContent = (TOTAL / 1000).toFixed(1) + " / " + (TOTAL / 1000).toFixed(1) + "s";
  }
  ui.classList.remove("hide");
}

btnReplay.onclick = () => { halt(true); prevNode = null; start(); };
btnToggle.onclick = () => {
  if (playing) halt(false);
  else if (idx < 0 || idx >= SCENES.length - 1) { prevNode = null; start(); }
  else { playing = true; btnToggle.textContent = "Pause"; playFrom(idx); }
};

document.addEventListener("keydown", e => {
  if (e.code === "Space") { e.preventDefault(); btnToggle.click(); }
  if (e.key === "r" || e.key === "R") btnReplay.click();
});
document.addEventListener("mousemove", () => {
  ui.classList.remove("hide");
  clearTimeout(window.__uiHide);
  if (playing) window.__uiHide = setTimeout(() => ui.classList.add("hide"), 1600);
});

/* --------------------------------------------------------------- scaling */
const stagearea = $("#stagearea");
function fit() {
  const w = stagearea.clientWidth, h = stagearea.clientHeight;
  stage.style.transform = `scale(${Math.min(w / 1600, h / 900)})`;
}
addEventListener("resize", fit);
fit();

/* -------------------------------------------------------------- kick off */
const params = new URLSearchParams(location.search);
if (params.has("clean")) document.body.classList.add("clean");
clock.textContent = "0.0 / " + (TOTAL / 1000).toFixed(1) + "s";
label.textContent = SCENES[0].label;
requestAnimationFrame(tick);

const only = parseInt(params.get("scene"), 10);
if (Number.isInteger(only) && only >= 1 && only <= SCENES.length) {
  idx = only - 1;
  showScene(idx);
  label.textContent = SCENES[idx].label + " (held)";
} else {
  setTimeout(start, 500);
}
</script>
</body>
</html>
