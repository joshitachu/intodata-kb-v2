# TODO: Database Agent will finalize this
version: "3.8"

services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: intodata_kb
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: voetbal123

  hindsight:
    image: ghcr.io/vectorize-io/hindsight:latest
    ports:
      - "8888:8888"
      - "9999:9999"
    environment:
      HINDSIGHT_API_LLM_PROVIDER: ollama
      HINDSIGHT_API_LLM_BASE_URL: http://host.docker.internal:11434/v1
      HINDSIGHT_API_LLM_MODEL: gemma3:12b
    volumes:
      - hindsight_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  kb-server:
    build:
      context: ../knowledge_base/mcp-server
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      MCP_DATABASE_URL: postgresql+asyncpg://admin:voetbal123@postgres:5432/intodata_kb
      MCP_PROJECT_ROOT: /app
      MCP_DATA_DIR: /app/data
      MCP_INTODOC_OUTPUT_DIR: /app/intodoc-output
    volumes:
      - ../knowledge_base/output:/app/output
      - ../knowledge_base/intodoc-output:/app/intodoc-output
      - ../knowledge_base/mcp-server/data:/app/data
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  qdrant_data:
  hindsight_data: