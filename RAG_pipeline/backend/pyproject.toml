[project]
name = "intodata-kb-backend"
version = "0.1.0"
description = "IntoData Knowledge Base — RAG backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "qdrant-client>=1.12.0",
    "ollama>=0.4.0",
    "python-multipart>=0.0.9",
    "PyPDF2>=3.0.0",
    "python-docx>=1.1.0",
    "python-pptx>=1.0.0",
    "openpyxl>=3.1.0",
    "tiktoken>=0.8.0",
    "httpx>=0.27.0",
    "scikit-learn>=1.5.0",

    "openai>=1.0.0",

    # Auth
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.0.0",
    "slowapi>=0.1.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "aiosqlite>=0.20.0",
    "ruff>=0.8.0",
]
hindsight = ["hindsight-client>=0.1.0"]

[build-system]
requires = ["setuptools>=70.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: requires Docker services (Qdrant, PostgreSQL, Ollama)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
