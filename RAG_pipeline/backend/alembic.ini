[alembic]
script_location = alembic
prepend_sys_path = .

# Connection string — overridden at runtime by env.py to use async engine from config.
# This placeholder is never used directly; set DATABASE_URL in your .env instead.
sqlalchemy.url = postgresql+asyncpg://postgres:changeme@localhost:5432/intodata_kb

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
