services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-intodata_kb}
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-intodata_kb}"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 512m
    cpus: 1.0
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "127.0.0.1:${QDRANT_HTTP_PORT:-6333}:6333"
      - "127.0.0.1:${QDRANT_GRPC_PORT:-6334}:6334"
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-}
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6333'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    mem_limit: 1g
    cpus: 1.0
    restart: unless-stopped

  hindsight:
    image: ghcr.io/vectorize-io/hindsight:latest
    ports:
      - "127.0.0.1:${HINDSIGHT_API_PORT:-8888}:8888"
      - "127.0.0.1:${HINDSIGHT_INTERNAL_PORT:-9999}:9999"
    environment:
      HINDSIGHT_API_LLM_PROVIDER: ollama
      HINDSIGHT_API_LLM_BASE_URL: http://host.docker.internal:11434/v1
      HINDSIGHT_API_LLM_MODEL: ${HINDSIGHT_LLM_MODEL:-gemma3:4b}
      HINDSIGHT_API_LLM_TIMEOUT: "300"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - hindsight_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    mem_limit: 2g
    cpus: 1.0
    restart: unless-stopped

  backend:
    pull_policy: build
    build:
      context: ./RAG_pipeline/backend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-intodata_kb}
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-documents}
      HINDSIGHT_URL: http://hindsight:8888
      HINDSIGHT_ENABLED: "true"
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-in-production-use-a-strong-random-key}
      ADMIN_DEFAULT_PASSWORD: ${ADMIN_DEFAULT_PASSWORD:-admin}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173,http://localhost:8001}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:3000}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-${SMTP_USER:-}}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_ADDRESS: ${SMTP_FROM_ADDRESS:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-IntoData Nexus}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      APP_ENV: ${APP_ENV:-production}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
      KIMI_API_KEY: ${KIMI_API_KEY:-}
      MCP_INGEST_API_KEY: ${MCP_INGEST_API_KEY:-}
      MCP_DOCS_BASE_URL: ${MCP_DOCS_BASE_URL:-http://mcp-server:8002/mcp}
      MCP_DOCS_RECONCILIATION_SERVICE_TOKEN: ${MCP_DOCS_RECONCILIATION_SERVICE_TOKEN:-}
      MCP_DOCS_RECONCILIATION_INTERVAL_SECONDS: ${MCP_DOCS_RECONCILIATION_INTERVAL_SECONDS:-60}
      MCP_DOCS_RECONCILIATION_BATCH_SIZE: ${MCP_DOCS_RECONCILIATION_BATCH_SIZE:-50}
      ADMIN_INITIAL_EMAIL: ${ADMIN_INITIAL_EMAIL:-admin@localhost}
      ALLOWED_IPS: ${ALLOWED_IPS:-}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-127.0.0.1}
      TENANT_NAME: ${TENANT_NAME:-IntoData}
      TENANT_SLUG: ${TENANT_SLUG:-intodata}
      TENANT_ENVIRONMENT: ${TENANT_ENVIRONMENT:-production}
      # Unified bounded agent-loop limits. Chat has one production route.
      AGENT_CHAT_MAX_ITERATIONS: ${AGENT_CHAT_MAX_ITERATIONS:-6}
      AGENT_CHAT_MAX_TOOL_CALLS: ${AGENT_CHAT_MAX_TOOL_CALLS:-4}
      AGENT_CHAT_DEADLINE_SECONDS: ${AGENT_CHAT_DEADLINE_SECONDS:-30}
      AGENT_CHAT_MAX_COST_USD: ${AGENT_CHAT_MAX_COST_USD:-0.25}
      AGENT_RUNTIME_V2_CANARY_STAGE: ${AGENT_RUNTIME_V2_CANARY_STAGE:-off}
      AGENT_RUNTIME_V2_ENABLED: ${AGENT_RUNTIME_V2_ENABLED:-false}
      AGENT_RUNTIME_V2_READONLY_USERS: ${AGENT_RUNTIME_V2_READONLY_USERS:-[]}
      AGENT_RUNTIME_V2_READONLY_PERCENT: ${AGENT_RUNTIME_V2_READONLY_PERCENT:-0}
      AGENT_RUNTIME_V2_TRANSPORTS: ${AGENT_RUNTIME_V2_TRANSPORTS:-["nonstream","stream"]}
      AGENT_RUNTIME_V2_PLANNING_ENABLED: ${AGENT_RUNTIME_V2_PLANNING_ENABLED:-false}
      AGENT_RUNTIME_V2_PLANNING_USERS: ${AGENT_RUNTIME_V2_PLANNING_USERS:-[]}
      AGENT_RUNTIME_V2_PLANNING_PERCENT: ${AGENT_RUNTIME_V2_PLANNING_PERCENT:-0}
      AGENT_RUNTIME_V2_EFFECTS_ENABLED: ${AGENT_RUNTIME_V2_EFFECTS_ENABLED:-false}
      AGENT_RUNTIME_V2_EFFECT_USERS: ${AGENT_RUNTIME_V2_EFFECT_USERS:-[]}
      AGENT_RUNTIME_V2_EFFECT_PERCENT: ${AGENT_RUNTIME_V2_EFFECT_PERCENT:-0}
      # Slice 6 is independently default-off until its rollout gate passes.
      AGENT_RUNTIME_V2_LIVE_STREAMING_ENABLED: ${AGENT_RUNTIME_V2_LIVE_STREAMING_ENABLED:-false}
      AGENT_RUNTIME_V2_LIVE_STREAMING_USERS: ${AGENT_RUNTIME_V2_LIVE_STREAMING_USERS:-[]}
      AGENT_RUNTIME_V2_LIVE_STREAMING_PERCENT: ${AGENT_RUNTIME_V2_LIVE_STREAMING_PERCENT:-0}
      AGENT_RUNTIME_V2_MODEL_TIMEOUT_SECONDS: ${AGENT_RUNTIME_V2_MODEL_TIMEOUT_SECONDS:-60}
      AGENT_RUNTIME_V2_READ_TOOL_TIMEOUT_SECONDS: ${AGENT_RUNTIME_V2_READ_TOOL_TIMEOUT_SECONDS:-90}
      AGENT_RUNTIME_V2_WRITE_TOOL_TIMEOUT_SECONDS: ${AGENT_RUNTIME_V2_WRITE_TOOL_TIMEOUT_SECONDS:-30}
      AGENT_RUNTIME_V2_WORKFLOW_HANDOFF_TIMEOUT_SECONDS: ${AGENT_RUNTIME_V2_WORKFLOW_HANDOFF_TIMEOUT_SECONDS:-15}
      AGENT_RUNTIME_V2_SOFT_DEADLINE_SECONDS: ${AGENT_RUNTIME_V2_SOFT_DEADLINE_SECONDS:-45}
      AGENT_RUNTIME_V2_HARD_DEADLINE_SECONDS: ${AGENT_RUNTIME_V2_HARD_DEADLINE_SECONDS:-120}
      AGENT_RUNTIME_V2_MAX_MODEL_CALLS: ${AGENT_RUNTIME_V2_MAX_MODEL_CALLS:-8}
      AGENT_RUNTIME_V2_SYNTHESIS_RESERVE_CALLS: ${AGENT_RUNTIME_V2_SYNTHESIS_RESERVE_CALLS:-2}
      AGENT_RUNTIME_V2_PROVIDER_MAX_RETRIES: ${AGENT_RUNTIME_V2_PROVIDER_MAX_RETRIES:-1}
      CSRF_ENABLED: ${CSRF_ENABLED:-true}
      SSO_ENABLED: ${SSO_ENABLED:-false}
      OIDC_DISCOVERY_URL: ${OIDC_DISCOVERY_URL:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-}
      # Live runtime provider (EP-004). Empty RUNTIME_PROVIDER_KEY keeps runtime
      # disabled. Set to "mock" for local validation, "stored" for DB-backed held
      # runtime data (seed via python -m src.runtime.store.seed), or "talend_tmc"
      # with the Talend vars below to use the real adapter. The Talend token is
      # supplied via a mounted secret file (TALEND_TMC_API_TOKEN_FILE), never inline.
      RUNTIME_PROVIDER_KEY: ${RUNTIME_PROVIDER_KEY:-}
      RUNTIME_PROVIDER_LABEL: ${RUNTIME_PROVIDER_LABEL:-Live runtime}
      RUNTIME_PROVIDER_HEALTH_URL: ${RUNTIME_PROVIDER_HEALTH_URL:-}
      RUNTIME_STATUS_TIMEOUT: ${RUNTIME_STATUS_TIMEOUT:-5.0}
      RUNTIME_TOOL_TIMEOUT: ${RUNTIME_TOOL_TIMEOUT:-10.0}
      RUNTIME_TOOL_RESULT_MAX_CHARS: ${RUNTIME_TOOL_RESULT_MAX_CHARS:-12000}
      RUNTIME_SYNC_SCHEDULER_ENABLED: ${RUNTIME_SYNC_SCHEDULER_ENABLED:-true}
      RUNTIME_SYNC_INTERVAL_SECONDS: ${RUNTIME_SYNC_INTERVAL_SECONDS:-60}
      RUNTIME_SYNC_SOURCE_KEY: ${RUNTIME_SYNC_SOURCE_KEY:-}
      RUNTIME_SYNC_PROJECT_IDS: ${RUNTIME_SYNC_PROJECT_IDS:-}
      RUNTIME_SEMANTIC_ENABLED: ${RUNTIME_SEMANTIC_ENABLED:-false}
      TALEND_TMC_BASE_URL: ${TALEND_TMC_BASE_URL:-}
      TALEND_TMC_API_TOKEN_FILE: ${TALEND_TMC_API_TOKEN_FILE:-}
      # Runtime source credential encryption (EP-004). Primary Fernet key is
      # required to persist any runtime source credentials; the *_previous vars
      # are optional and only used during a lazy key rotation window.
      SOURCE_CREDENTIALS_ENCRYPTION_KEY: ${SOURCE_CREDENTIALS_ENCRYPTION_KEY:?Set SOURCE_CREDENTIALS_ENCRYPTION_KEY (Fernet key) in .env}
      SOURCE_CREDENTIALS_ENCRYPTION_KEY_PREVIOUS: ${SOURCE_CREDENTIALS_ENCRYPTION_KEY_PREVIOUS:-}
      SOURCE_CREDENTIALS_ENCRYPTION_KEY_ID: ${SOURCE_CREDENTIALS_ENCRYPTION_KEY_ID:-primary}
      SOURCE_CREDENTIALS_ENCRYPTION_KEY_PREVIOUS_ID: ${SOURCE_CREDENTIALS_ENCRYPTION_KEY_PREVIOUS_ID:-previous}
      # LangSmith tracing for LangGraph observability
      # SDK >=0.10 reads LANGSMITH_TRACING; LANGCHAIN_TRACING_ENABLED is kept for older SDKs.
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-${LANGCHAIN_TRACING_ENABLED:-true}}
      LANGCHAIN_TRACING_ENABLED: ${LANGCHAIN_TRACING_ENABLED:-true}
      LANGCHAIN_API_KEY: ${LANGCHAIN_API_KEY:-}
      LANGCHAIN_PROJECT: ${LANGCHAIN_PROJECT:-nexus-harness-dev}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 120s
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    mem_limit: 1g
    cpus: 2.0
    restart: unless-stopped

  frontend:
    pull_policy: build
    build:
      context: ./RAG_pipeline/frontend
      dockerfile: Dockerfile
      args:
        KB_API_URL: ${KB_API_URL:-http://mcp-server:8002}
        NEXT_PUBLIC_TENANT_NAME: ${TENANT_NAME:-IntoData}
        NEXT_PUBLIC_TENANT_SLUG: ${TENANT_SLUG:-intodata}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      FASTAPI_URL: http://backend:8000
      KB_API_URL: ${KB_API_URL:-http://mcp-server:8002}
      HOSTNAME: 0.0.0.0
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      backend:
        condition: service_healthy
      mcp-server:
        condition: service_healthy
    mem_limit: 512m
    cpus: 1.0
    restart: unless-stopped

  mcp-server:
    pull_policy: build
    build:
      context: ./knowledge_base
      dockerfile: mcp-server/Dockerfile
      args:
        OPENCODE_VERSION: ${MCP_OPENCODE_VERSION:-1.18.7}
    command:
      - sh
      - -c
      - |
        python -c '
        import asyncio
        from mcp_server.db.session import engine
        from mcp_server.db.models import Base
        async def main():
            async with engine.begin() as c:
                await c.run_sync(Base.metadata.create_all)
        asyncio.run(main())
        '
        alembic upgrade head
        python -m mcp_server --serve --host 0.0.0.0 --port 8002
    ports:
      - "127.0.0.1:${MCP_PORT:-8002}:8002"
    environment:
      MCP_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-intodata_kb}
      MCP_RAG_BASE_URL: http://backend:8000
      # Unit count at/below which doc-gen uses the direct path (skips Phase 1
      # investigation + Phase 2 tool loops). Lowered to 5 so 10-unit scoped
      # projects still run full Phase 1 investigation.
      MCP_SMALL_PROJECT_THRESHOLD: ${MCP_SMALL_PROJECT_THRESHOLD:-5}
      MCP_INTODOC_COMMAND: intodoc
      MCP_CLAUDE_COMMAND: ${MCP_CLAUDE_COMMAND:-claude}
      MCP_CLAUDE_MODEL: ${MCP_CLAUDE_MODEL:-sonnet}
      # OpenCode is pinned in the image; the operator supplies its model route
      # and any provider/MCP connector configuration.
      MCP_OPENCODE_COMMAND: ${MCP_OPENCODE_COMMAND:-opencode}
      MCP_OPENCODE_CONFIG_PATH: ${MCP_OPENCODE_CONFIG_PATH:-}
      MCP_OPENCODE_MODEL: ${MCP_OPENCODE_MODEL:-}
      MCP_OPENCODE_PRIMARY_AGENT: ${MCP_OPENCODE_PRIMARY_AGENT:-build}
      MCP_OPENCODE_VERSION: ${MCP_OPENCODE_VERSION:-1.18.7}
      MCP_OPENCODE_AUTO_APPROVE: ${MCP_OPENCODE_AUTO_APPROVE:-true}
      MCP_OPENCODE_TIMEOUT_SECONDS: ${MCP_OPENCODE_TIMEOUT_SECONDS:-1800}
      MCP_OPENCODE_OLLAMA_BASE_URL: ${MCP_OPENCODE_OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
      MCP_OPENCODE_MCP_READ_ALLOWLIST_JSON: ${MCP_OPENCODE_MCP_READ_ALLOWLIST_JSON:-{}}
      MCP_DATA_DIR: /app/data
      MCP_INTODOC_OUTPUT_DIR: /app/intodoc-output
      MCP_PROJECT_ROOT: /app/workspace
      MCP_HINDSIGHT_ENABLED: "true"
      MCP_HINDSIGHT_URL: http://hindsight:8888
      MCP_LIVING_DOC_PATCHING_ENABLED: ${MCP_LIVING_DOC_PATCHING_ENABLED:-true}
      MCP_LIVING_DOC_ROLLOUT_STAGE: ${MCP_LIVING_DOC_ROLLOUT_STAGE:-approval_only}
      MCP_IMPACT_ROUTING_ENABLED: ${MCP_IMPACT_ROUTING_ENABLED:-false}
      MCP_LOG_LEVEL: ${MCP_LOG_LEVEL:-INFO}
      MCP_JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-in-production-use-a-strong-random-key}
      MCP_ALLOWED_ORIGINS: ${MCP_ALLOWED_ORIGINS:-${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173,http://localhost:8001}}
      MCP_INGEST_API_KEY: ${MCP_INGEST_API_KEY:-}
      MCP_ALLOWED_IPS: ${MCP_ALLOWED_IPS:-}
      MCP_TRUSTED_PROXIES: ${MCP_TRUSTED_PROXIES:-${TRUSTED_PROXIES:-127.0.0.1}}
      MCP_APP_ENV: ${MCP_APP_ENV:-${APP_ENV:-production}}
      MCP_GITHUB_WEBHOOK_SECRET: ${MCP_GITHUB_WEBHOOK_SECRET:-}
      MCP_PIPELINE_DEBUG: "1"
      MCP_MAX_UPLOAD_ZIP_BYTES: ${MCP_MAX_UPLOAD_ZIP_BYTES:-3221225472}
      MCP_MAX_UPLOAD_ZIP_UNCOMPRESSED_BYTES: ${MCP_MAX_UPLOAD_ZIP_UNCOMPRESSED_BYTES:-6442450944}
      MCP_MAX_UPLOAD_ZIP_ENTRIES: ${MCP_MAX_UPLOAD_ZIP_ENTRIES:-300000}
      MCP_DEV_WEBHOOK_SKIP_SIGNATURE: ${MCP_DEV_WEBHOOK_SKIP_SIGNATURE:-false}
      MCP_TOKEN_ENCRYPTION_KEY: ${MCP_TOKEN_ENCRYPTION_KEY:-}
      MCP_PUBLIC_URL: ${MCP_PUBLIC_URL:-${PUBLIC_APP_URL:-}}
      MCP_GITHUB_APP_ID: ${MCP_GITHUB_APP_ID:-}
      MCP_GITHUB_APP_SLUG: ${MCP_GITHUB_APP_SLUG:-}
      MCP_GITHUB_APP_CLIENT_ID: ${MCP_GITHUB_APP_CLIENT_ID:-}
      MCP_GITHUB_APP_CLIENT_SECRET: ${MCP_GITHUB_APP_CLIENT_SECRET:-}
      MCP_GITHUB_APP_PRIVATE_KEY: ${MCP_GITHUB_APP_PRIVATE_KEY:-}
      MCP_GITHUB_APP_PRIVATE_KEY_FILE: ${MCP_GITHUB_APP_PRIVATE_KEY_FILE:-}
      MCP_GITHUB_APP_POST_INSTALL_REDIRECT: ${MCP_GITHUB_APP_POST_INSTALL_REDIRECT:-}
      MCP_PACK_GOVERNANCE_TRUSTED_SOURCES_JSON: ${MCP_PACK_GOVERNANCE_TRUSTED_SOURCES_JSON:-[]}
      MCP_OLLAMA_BASE_URL: http://host.docker.internal:11434
      MCP_DOC_GENERATION_PROVIDER: ${MCP_DOC_GENERATION_PROVIDER:-custom}
      MCP_DOC_GENERATION_MODEL: ${MCP_DOC_GENERATION_MODEL:-anthropic/claude-sonnet-4-6}
      MCP_DOC_GENERATION_WRITE_MODEL: ${MCP_DOC_GENERATION_WRITE_MODEL:-anthropic/claude-sonnet-4-6}
      MCP_DOC_GENERATION_INVESTIGATION_MODEL: ${MCP_DOC_GENERATION_INVESTIGATION_MODEL:-google/gemini-2.5-flash}
      MCP_DOC_GENERATION_FALLBACK_MODEL: ${MCP_DOC_GENERATION_FALLBACK_MODEL:-openai/gpt-5.4}
      MCP_DOC_GENERATION_API_KEY: ${MCP_DOC_GENERATION_API_KEY:-${LLM_API_KEY:-}}
      MCP_DOC_GENERATION_BASE_URL: ${MCP_DOC_GENERATION_BASE_URL:-}
      MCP_DOC_GENERATION_DEEPSEEK_API_KEY: ${MCP_DOC_GENERATION_DEEPSEEK_API_KEY:-}
      MCP_DOC_GENERATION_DEEPSEEK_BASE_URL: ${MCP_DOC_GENERATION_DEEPSEEK_BASE_URL:-}
      MCP_DOC_GENERATION_ROUTE33_API_KEY: ${MCP_DOC_GENERATION_ROUTE33_API_KEY:-}
      MCP_DOC_GENERATION_ROUTE33_BASE_URL: ${MCP_DOC_GENERATION_ROUTE33_BASE_URL:-https://api.route33.ai/v1}
      MCP_MODEL_PRICING_JSON: ${MCP_MODEL_PRICING_JSON:-}
      MCP_AGENT_PHASE1_AGENTIC: "true"
      MCP_DEEP_DIVE_ENGINE: ${MCP_DEEP_DIVE_ENGINE:-repo_agent}
      MCP_DEEP_DIVE_MODEL: ${MCP_DEEP_DIVE_MODEL:-anthropic/claude-sonnet-4-6}
      MCP_DEEP_DIVE_API_KEY: ${MCP_DEEP_DIVE_API_KEY:-}
      MCP_DEEP_DIVE_BASE_URL: ${MCP_DEEP_DIVE_BASE_URL:-}
      MCP_OPS_CLIENT_SLUG: ${MCP_OPS_CLIENT_SLUG:-}
      MCP_OPS_ENVIRONMENT: ${MCP_OPS_ENVIRONMENT:-production}
      MCP_OPS_RELEASE_VERSION: ${MCP_OPS_RELEASE_VERSION:-}
      MCP_OPS_TELEMETRY_URL: ${MCP_OPS_TELEMETRY_URL:-}
      MCP_OPS_TELEMETRY_API_KEY: ${MCP_OPS_TELEMETRY_API_KEY:-}
      MCP_OPS_TELEMETRY_INTERVAL_SECONDS: ${MCP_OPS_TELEMETRY_INTERVAL_SECONDS:-300}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      ROUTE33_API_KEY: ${ROUTE33_API_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./knowledge_base/mcp-server/data:/app/data
      - ./knowledge_base/intodoc-output:/app/intodoc-output
      - ./knowledge_base/output:/app/workspace/output
      - ./knowledge_base/packs:/app/workspace/packs
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8002/health')\" || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_healthy
      hindsight:
        condition: service_healthy
    mem_limit: 3g
    cpus: 2.0
    restart: unless-stopped

  mission-control:
    pull_policy: build
    build:
      context: ./mission_control
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${MC_PORT:-9100}:9100"
    environment:
      MC_API_KEY: ${MC_API_KEY:-mc-dev-local-secret}
      MC_SNAPSHOTS_DIR: /app/snapshots
    volumes:
      - mission_control_snapshots:/app/snapshots
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:9100/health')\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    mem_limit: 128m
    cpus: 0.25
    restart: unless-stopped

  dashboard:
    pull_policy: build
    build:
      context: ./knowledge_base/dashboard
      dockerfile: Dockerfile
      args:
        VITE_LOGIN_URL: ${VITE_LOGIN_URL:-${PUBLIC_APP_URL:-http://localhost:3000}/login}
        VITE_FLEET_ENABLED: ${FLEET_ENABLED:-true}
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-8001}:8001"
    environment:
      MCP_ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173,http://localhost:8001}
      # MC_API_KEY is injected into nginx at runtime via envsubst — never a build arg.
      MC_API_KEY: ${MC_API_KEY:-mc-dev-local-secret}
      NGINX_ENVSUBST_TEMPLATE_VARS: MC_API_KEY
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8001/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    mem_limit: 256m
    cpus: 0.5
    depends_on:
      mcp-server:
        condition: service_healthy
      mission-control:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  qdrant_data:
  hindsight_data:
  mission_control_snapshots:
