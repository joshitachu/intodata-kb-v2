services:
  opencode-deepseek-smoke:
    build:
      context: .
      args:
        OPENCODE_VERSION: "1.18.4"
    entrypoint: ["opencode", "run", "--pure", "--format", "json", "--model", "deepseek/deepseek-v4-flash"]
    command:
      - "Reply with exactly: NEXUS_DEEPSEEK_OPENCODE_OK"
    environment:
      DEEPSEEK_API_KEY: ${MCP_DOC_GENERATION_DEEPSEEK_API_KEY:?Set MCP_DOC_GENERATION_DEEPSEEK_API_KEY in .env}
      OPENCODE_CONFIG: /opt/nexus/opencode.deepseek.smoke.json
    volumes:
      - ./opencode.deepseek.smoke.json:/opt/nexus/opencode.deepseek.smoke.json:ro
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:uid=10001,gid=10001,mode=0700
      - /runtime:uid=10001,gid=10001,mode=0700
      - /var/lib/opencode:uid=10001,gid=10001,mode=0700
