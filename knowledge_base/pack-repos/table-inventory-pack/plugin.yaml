name: table-inventory
version: "1.0.0"
description: >
  Focused database table inventory pack for codebases with embedded SQL,
  ORM usage, DDL gaps, and documentation mismatches. Produces one source-of-truth
  table inventory document with field-level usage, SQL evidence, and DDL alignment.

docs:
  - name: TABLE_INVENTORY
    sections:
      - Executive Findings
      - Evidence Sources and Coverage
      - Database Connections
      - Environment Baseline and ACC vs PRD Caveats
      - Table Inventory
      - Table Definitions
      - SQL-to-Table Traceability
      - Field Usage Matrix
      - SQL Query Inventory
      - ORM and Implicit Table Usage
      - DDL Alignment and Gaps
      - CosmosDB / Non-relational Caveats
      - Lean Schema Recommendations
      - Evidence Review and 4-Eyes Sign-off
      - Blocking Questions for Kruitbosch
      - Evidence Register
  - name: DDL_REBUILD_SCRIPTS
    sections:
      - Script Generation Status
      - Current Version Schema Baseline
      - Target Environment Assumptions
      - Execution Order
      - Generated DDL Scripts
      - Indexes Keys and Constraints
      - Seed or Reference Data Requirements
      - Validation Queries
      - Unresolved Blockers
      - Evidence Review and 4-Eyes Sign-off
      - Evidence Register

quality_gates:
  mode: blocking
  required_sections:
    TABLE_INVENTORY:
      - Evidence Sources and Coverage
      - Table Inventory
      - Table Definitions
      - Field Usage Matrix
      - SQL Query Inventory
      - DDL Alignment and Gaps
      - Environment Baseline and ACC vs PRD Caveats
      - SQL-to-Table Traceability
      - Evidence Review and 4-Eyes Sign-off
      - Evidence Register
    DDL_REBUILD_SCRIPTS:
      - Current Version Schema Baseline
      - Generated DDL Scripts
      - Validation Queries
      - Unresolved Blockers
      - Evidence Review and 4-Eyes Sign-off
      - Evidence Register
  required_terms:
    - table
    - field
    - SQL
    - DDL
    - source
  required_evidence_terms:
    - file
    - query
    - reference
  min_doc_bytes:
    TABLE_INVENTORY: 5000
    DDL_REBUILD_SCRIPTS: 2500

steps:
  - id: full_pipeline
    type: harness
