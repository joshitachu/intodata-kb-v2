name: talend-to-azure-migration
version: 1.0.0
description: >-
  Swap Pack that analyzes a Talend project and generates a deployable
  Talend-to-Azure migration bundle: source analysis, target architecture,
  Azure Data Factory pipeline JSON, Bicep infrastructure, and a cutover
  runbook. Generated Azure artifacts are parameterized and Key Vault backed
  so they can be deployed into a target Azure environment without edits to
  the artifact bodies.

phases:
  investigation: run
  analysis: run
  scorecard: run
  doc_bundles: run

docs:
  - name: 01_TALEND_ANALYSIS
    required_sections:
      - Project Summary
      - Job Inventory
      - Component Inventory
      - Contexts And Connections
      - Orchestration And Scheduling
      - Evidence Notes
  - name: 02_AZURE_TARGET_ARCHITECTURE
    required_sections:
      - Context And Assumptions
      - Target Architecture
      - Component Mapping
      - Key Design Decisions
      - Risks And Open Questions
      - Evidence Notes
  - name: 03_ADF_PIPELINES
    required_sections:
      - Deployment Instructions
      - Linked Services
      - Datasets
      - Pipelines
      - Triggers
      - Parameter Reference
      - Evidence Notes
  - name: 04_INFRA_DEPLOYMENT
    required_sections:
      - Prerequisites
      - Bicep Templates
      - Parameter Files
      - Deployment Script
      - Post-Deployment Configuration
      - Evidence Notes
  - name: 05_CUTOVER_RUNBOOK
    required_sections:
      - Migration Sequence
      - Data Validation
      - Parallel Run
      - Cutover Steps
      - Rollback Plan
      - Evidence Notes

quality_gates:
  mode: blocking
  min_doc_bytes:
    01_TALEND_ANALYSIS: 2500
    02_AZURE_TARGET_ARCHITECTURE: 2500
    03_ADF_PIPELINES: 4000
    04_INFRA_DEPLOYMENT: 3000
    05_CUTOVER_RUNBOOK: 2000

steps:
  - id: generate_docs
    type: harness

certification:
  provenance: swap-pack-starter
