# Versioned Talend investigation method.
#
# The five guide files are copied VERBATIM from the Integration Suite at the
# revision below. `nexus-adaptation.md` is the only Nexus-authored file here: it
# reconciles the guides' procedural instructions with a Nexus run.
#
# `sha256` is computed over the bytes AS STORED IN THIS REPOSITORY.
# `services/investigation_method.py` verifies every digest at load time and
# fails closed on a mismatch. Editing a guide without updating its digest is
# therefore a hard error, not a silent drift: a method whose provenance cannot
# be proved must not be handed to a model as authority.
#
# To re-import from a newer Integration Suite revision: copy the files, update
# `source.revision`, recompute every `sha256`, and append an `update_log` entry
# naming what changed. Do not edit a copied guide in place -- an adaptation
# belongs in `nexus-adaptation.md`, where it is visibly Nexus-owned.

