update_log:
  - date: "2026-09-24"
    revision: 0c68b22633a6d067fcc30e29dd18e86d9ea6d24f
    change: >-
      Initial import of the two platform-agnostic method files. Taken because
      the confidence vocabulary is stricter and better factored than the
      ad-hoc evidence rules previously spread through the generation prompt:
      Basis (Confirmed/Inferred/Unknown) is per finding and mandatory, the
      document Ceiling is derived from the input class and never hand-set, and
      aggregation is a minimum rather than a product. Two rules in particular
      replace Nexus prose that said less precisely the same thing -- "a finding
      graded Confirmed must carry a locus", and "absence is not Confirmed: a
      search returning nothing is Confirmed about the search itself, Inferred
      about the thing's actual absence".
  - date: "2026-09-25"
    revision: unknown
    change: >-
      Consolidated the five assessment catalogues (scoring-rubric,
      anti-patterns, red-flags, security-checklist, pattern-library) into this
      directory from src/mcp_server/templates/, where they had sat since
      2026-07-01 with no digest, no provenance and no statement of which copy
      wins. Adding the pinned lane beside an unpinned one made drift MORE
      likely, not less: two sources for one method layer. Both consumers now
      read these bytes -- the CLI lane via ClaudeService._preprocess_scan_data,
      which copies them to _preprocess/_*.md under their long-standing
      destination names, and the custom lane's Phase 2.6, which reads those same
      names. Bytes unchanged: every file was diffed against upstream during the
      move and every one DIFFERS, so each carries revision: unknown plus a
      divergence note rather than a provenance claim that would not survive a
      reviewer running the same diff. Digests are over the bytes as moved.
