# Platform-AGNOSTIC investigation method, shared by every platform.
#
# The per-platform directories beside this one (talend/, ...) carry parsing
# guidance that is wrong to hand to another platform. The files here are the
# opposite: they define VOCABULARY, SELF-CHECK and the assessment reference
# catalogues. Filing them under talend/ would have made a Workato run either
# miss them or inherit Talend parsing rules to get them.
#
# `sha256` is computed over the bytes AS STORED IN THIS REPOSITORY.
# `services/investigation_method.py` verifies every digest at load time and
# fails closed on a mismatch. Editing a copied file without updating its digest
# is a hard error, not silent drift. The check runs in both directions: a file
# on disk that no entry below names is also a failure, so a guide cannot be
# dropped into this directory and staged with no provenance.
#
# TWO ORIGIN CLASSES LIVE HERE, and the difference is recorded per file rather
# than implied by the directory:
#
#   * `confidence-model.md` and `validation-checklist.md` are VERBATIM copies of
#     the upstream files of the same name at the revision in `source:` below --
#     re-verified byte-for-byte on 2026-09-25 against
#     `templates/integration/method/<name>.md` at 0c68b22633a6d067fcc30e29dd18e86d9ea6d24f.
#
#   * the five assessment catalogues (`anti-patterns.md`, `pattern-library.md`,
#     `red-flags.md`, `scoring-rubric.md`, `security-checklist.md`) are NOT
#     upstream copies. They were imported into `src/mcp_server/templates/` on
#     2026-07-01 with no digest and no provenance record, and consolidated into
#     this directory on 2026-09-25 so that one mechanism -- not two -- owns the
#     method layer. Each was diffed against upstream during that move and each
#     DIFFERS; see the per-file `divergence:` notes. They therefore carry
#     `revision: unknown`, which OVERRIDES the method-level `source.revision`
#     for those files. Their bytes were deliberately left untouched: they are
#     what the shipped Phase 2.6 scorecard was calibrated on, and METHOD.md
#     cites their `AP-xxx-nnn` / `RF-xxx-nnn` identifier schemes, which upstream
#     does not use. Reconciling them with upstream is open work, not something
#     this move did silently.
#
# `source:` below describes where the VERBATIM files came from. A file that says
# otherwise in its own `revision:` is the authority on itself.
#
# PROVENANCE / PERMISSION. The upstream repository
# (github.com/santiagopereda/integration-suite) carries CONTRIBUTING.md but no
# LICENSE file, so no licence is granted explicitly by publication. The Talend
# guides already here were taken from a colleague's checkout, which suggests an
# understanding exists; this import was made on an explicit instruction after
# that gap was raised. It is recorded here rather than left implicit so the
# decision is auditable and cleanly reversible: delete this directory and the
# `_shared` entry, and nothing else depends on it.

platform: _shared
method_version: shared-method-2

