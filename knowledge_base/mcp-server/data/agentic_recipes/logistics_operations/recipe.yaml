{
  "id": "logistics-operations",
  "version": "1.0.0",
  "schema_version": 1,
  "certification_id": "bundled:nexus:logistics-operations:1.0.0",
  "source_requirements": [
    {"source_role": "operational_policy", "required_capabilities": ["searchable_text"]},
    {"source_role": "shipment_events", "required_capabilities": ["structured_records", "tabular_data"]},
    {"source_role": "mapping_reference", "required_capabilities": ["mapping_reference", "tabular_data"]},
    {"source_role": "runtime_observation", "required_capabilities": ["runtime_events", "timestamped_records"]}
  ],
  "default_scope": {
    "required_capabilities": ["structured_records"],
    "budgets": {"max_source_items": 1000, "max_evidence_items": 5000, "max_bytes": 16777216, "max_input_tokens": 120000, "max_tool_calls": 20, "max_elapsed_seconds": 1800},
    "unknown_policy": "disclose"
  },
  "roles": ["writer"],
  "required_model_capabilities": ["tools"],
  "allowed_tools": ["nexus_experiment_get_contract", "nexus_experiment_list_evidence", "nexus_experiment_search_evidence", "nexus_experiment_read_evidence", "nexus_experiment_traverse_relationships", "nexus_experiment_write_artifact", "nexus_experiment_submit_task"],
  "budgets": {"max_nodes": 10, "max_depth": 4, "max_fanout": 4, "max_attempts": 2, "max_concurrency": 2},
  "validators": ["markdown-structure", "source-citation-resolution"],
  "quality_gates": ["required-output-completeness", "no-unsupported-claims"],
  "metadata": {
    "grounded_execution": {
      "workflow_mode": "recipe",
      "max_parallelism": 2,
      "repair_limit": 1,
      "max_context_bytes": 12582912,
      "max_input_tokens": 120000,
      "max_tool_calls": 20,
      "validators": ["evidence-locators", "cross-document-consistency", "static-runtime-boundary", "security-language", "secret-safety"],
      "required_primary_artifacts": ["candidate/orchestration/execution_plan.json", "candidate/orchestration/evidence_registry.json", "candidate/orchestration/coverage_ledger.json"],
      "roles": [
        {"id": "shipment-evidence", "agent": "nexus-doc-evidence", "stage": "evidence", "owns": ["candidate/orchestration/evidence_packets/shipments.json"], "depends_on": [], "source_globs": ["role_inputs/shipment-evidence/**"], "max_context_bytes": 3145728, "model_policy": "inherit"},
        {"id": "operations-analysis", "agent": "nexus-doc-analyst", "stage": "analysis", "owns": ["candidate/intermediates/operations_analysis.md"], "depends_on": ["shipment-evidence"], "source_globs": ["role_inputs/operations-analysis/**", "candidate/orchestration/evidence_packets/**"], "max_context_bytes": 3145728, "model_policy": "inherit"},
        {"id": "operations-writer", "agent": "nexus-doc-pack-writer", "stage": "writing", "owns": ["candidate/docs/operations_runbook.md", "candidate/docs/exception_inventory.md"], "depends_on": ["operations-analysis"], "source_globs": ["role_inputs/operations-writer/**", "candidate/intermediates/**", "candidate/orchestration/evidence_packets/**"], "max_context_bytes": 3145728, "model_policy": "inherit"},
        {"id": "operations-reviewer", "agent": "nexus-doc-reviewer", "stage": "review", "owns": ["candidate/orchestration/review_report.md"], "depends_on": ["operations-writer"], "source_globs": ["role_inputs/operations-reviewer/**", "candidate/docs/**", "candidate/orchestration/claim_matrix.json"], "max_context_bytes": 3145728, "model_policy": "inherit"}
      ]
    }
  },
  "output_contracts": [
    {"id": "evidence_profile", "path": "receipts/evidence_profile.json", "media_type": "application/json"},
    {"id": "analysis", "path": "receipts/analysis.json", "media_type": "application/json"},
    {"id": "operations_runbook", "path": "operations_runbook.md", "required_sections": ["Operations"]},
    {"id": "exception_inventory", "path": "exception_inventory.md", "required_sections": ["Exceptions"]}
  ],
  "task_templates": [
    {"id": "evidence", "task_type": "evidence_profile", "role": "writer", "prompt_ref": "prompts/evidence.md", "output_ids": ["evidence_profile"], "validators": ["source-citation-resolution"]},
    {"id": "analysis", "task_type": "analysis", "role": "writer", "prompt_ref": "prompts/analysis.md", "output_ids": ["analysis"], "depends_on": ["evidence"], "dependency_output_refs": ["evidence_profile"], "validators": ["source-citation-resolution"]},
    {"id": "document", "task_type": "synthesis", "role": "writer", "prompt_ref": "prompts/document.md", "output_ids": ["operations_runbook", "exception_inventory"], "depends_on": ["analysis"], "dependency_output_refs": ["analysis"], "for_each": "outputs", "validators": ["markdown-structure", "source-citation-resolution"]}
  ]
}
