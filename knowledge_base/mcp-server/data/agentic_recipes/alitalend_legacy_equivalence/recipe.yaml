{
  "id": "alitalend-legacy-equivalence",
  "version": "1.0.0",
  "schema_version": 1,
  "certification_id": "bundled:nexus:alitalend-legacy-equivalence:1.0.0",
  "source_requirements": [
    {"source_role": "implementation", "required_capabilities": ["searchable_text", "structured_records"]},
    {"source_role": "legacy_baseline", "required_capabilities": ["documentation", "metrics"], "optional": true}
  ],
  "default_scope": {
    "required_capabilities": ["searchable_text"],
    "budgets": {"max_source_items": 1000, "max_evidence_items": 10000, "max_bytes": 8589934592, "max_input_tokens": 96000000, "max_tool_calls": 8000, "max_elapsed_seconds": 3600},
    "unknown_policy": "disclose"
  },
  "roles": ["writer"],
  "required_model_capabilities": ["tools"],
  "allowed_tools": ["nexus_experiment_get_contract", "nexus_experiment_list_evidence", "nexus_experiment_search_evidence", "nexus_experiment_read_evidence", "nexus_experiment_traverse_relationships", "nexus_experiment_write_artifact", "nexus_experiment_submit_task"],
  "budgets": {"max_nodes": 25, "max_depth": 4, "max_fanout": 10, "max_attempts": 2, "max_concurrency": 4},
  "validators": ["markdown-structure", "source-citation-resolution"],
  "quality_gates": ["required-output-completeness", "no-unsupported-claims"],
  "metadata": {
    "grounded_execution": {
      "workflow_mode": "recipe",
      "max_parallelism": 4,
      "repair_limit": 1,
      "max_context_bytes": 536870912,
      "max_input_tokens": 96000000,
      "max_tool_calls": 8000,
      "validators": ["ledger-claims", "evidence-locators", "cross-document-consistency", "static-runtime-boundary", "security-language", "secret-safety"],
      "required_primary_artifacts": ["candidate/orchestration/execution_plan.json", "candidate/orchestration/evidence_registry.json", "candidate/orchestration/coverage_ledger.json"],
      "roles": [
        {"id": "evidence-structure", "agent": "nexus-doc-evidence", "stage": "evidence", "owns": ["candidate/orchestration/evidence_packets/structure.json"], "depends_on": [], "source_globs": ["role_inputs/evidence-structure/**", "FACT_LEDGER.json"], "max_context_bytes": 134217728, "model_policy": "inherit"},
        {"id": "evidence-runtime", "agent": "nexus-doc-evidence", "stage": "evidence", "owns": ["candidate/orchestration/evidence_packets/runtime.json"], "depends_on": [], "source_globs": ["role_inputs/evidence-runtime/**", "FACT_LEDGER.json"], "max_context_bytes": 67108864, "model_policy": "inherit"},
        {"id": "analysis", "agent": "nexus-doc-analyst", "stage": "analysis", "fanout": "evidence_batches", "owns_template": "candidate/intermediates/phase2/${batch_id}.md", "depends_on": ["evidence-structure", "evidence-runtime"], "source_globs": ["role_inputs/analysis/**", "candidate/orchestration/evidence_packets/**", "FACT_LEDGER.json"], "max_context_bytes": 16777216, "model_policy": "inherit"},
        {"id": "analysis-scorecard", "agent": "nexus-doc-analyst", "stage": "analysis", "owns": ["candidate/intermediates/phase2_6/006_scorecard.md"], "depends_on": ["evidence-structure", "evidence-runtime"], "source_globs": ["role_inputs/analysis-scorecard/**", "candidate/orchestration/evidence_packets/**", "FACT_LEDGER.json"], "max_context_bytes": 16777216, "model_policy": "inherit"},
        {"id": "writer-foundation", "agent": "nexus-doc-pack-writer", "stage": "writing", "owns": ["candidate/docs/00_AGENT_BRIEF.md", "candidate/docs/01_ARCHITECTURE_MAP.md", "candidate/docs/02_COMPONENT_INVENTORY.md", "candidate/docs/03_DATA_FLOWS_AND_LINEAGE.md", "candidate/docs/04_BUSINESS_RULES_AND_TRANSFORMATIONS.md"], "depends_on": ["analysis", "analysis-scorecard"], "source_globs": ["role_inputs/writer-foundation/**", "candidate/intermediates/**", "candidate/orchestration/evidence_packets/**", "FACT_LEDGER.json"], "max_context_bytes": 16777216, "model_policy": "inherit"},
        {"id": "writer-operations", "agent": "nexus-doc-pack-writer", "stage": "writing", "owns": ["candidate/docs/05_RUNTIME_CONFIG_AND_EXTERNALS.md", "candidate/docs/06_OPERATIONS_TESTING_AND_DEBUGGING.md", "candidate/docs/07_QUALITY_SECURITY_RISK_SCORECARD.md", "candidate/docs/08_CHANGE_PLAYBOOK.md", "candidate/docs/09_EXECUTIVE_SUMMARY.md"], "depends_on": ["analysis", "analysis-scorecard"], "source_globs": ["role_inputs/writer-operations/**", "candidate/intermediates/**", "candidate/orchestration/evidence_packets/**", "FACT_LEDGER.json"], "max_context_bytes": 16777216, "model_policy": "inherit"},
        {"id": "unit-doc-writer", "agent": "nexus-doc-pack-writer", "stage": "writing", "fanout": "evidence_batches", "owns_template": "candidate/docs/units/${unit}.md", "depends_on": ["analysis", "analysis-scorecard"], "source_globs": ["role_inputs/unit-doc-writer/**", "candidate/intermediates/**", "candidate/orchestration/evidence_packets/**", "FACT_LEDGER.json"], "max_context_bytes": 16777216, "model_policy": "inherit"},
        {"id": "business-topology", "agent": "nexus-doc-topology", "stage": "topology", "owns": ["candidate/topology/business_topology.json"], "depends_on": ["analysis", "analysis-scorecard"], "source_globs": ["role_inputs/business-topology/**", "candidate/intermediates/**", "candidate/orchestration/evidence_packets/**"], "max_context_bytes": 67108864, "model_policy": "inherit", "failure_policy": "warn"},
        {"id": "reviewer", "agent": "nexus-doc-reviewer", "stage": "review", "owns": ["candidate/orchestration/review_report.md"], "depends_on": ["writer-foundation", "writer-operations", "unit-doc-writer"], "source_globs": ["role_inputs/reviewer/**", "candidate/docs/**", "candidate/orchestration/claim_matrix.json", "FACT_LEDGER.json"], "max_context_bytes": 16777216, "model_policy": "inherit"}
      ]
    }
  },
  "output_contracts": [
    {"id": "evidence_profile", "path": "receipts/evidence_profile.json", "media_type": "application/json"},
    {"id": "analysis", "path": "receipts/analysis.json", "media_type": "application/json"},
    {"id": "business_topology", "path": "topology/business_topology.json", "media_type": "application/json"},
    {"id": "00_AGENT_BRIEF", "path": "00_AGENT_BRIEF.md", "required_sections": ["Purpose"]},
    {"id": "01_ARCHITECTURE_MAP", "path": "01_ARCHITECTURE_MAP.md", "required_sections": ["Architecture"]},
    {"id": "02_COMPONENT_INVENTORY", "path": "02_COMPONENT_INVENTORY.md", "required_sections": ["Components"]},
    {"id": "03_DATA_FLOWS_AND_LINEAGE", "path": "03_DATA_FLOWS_AND_LINEAGE.md", "required_sections": ["Data Flows"]},
    {"id": "04_BUSINESS_RULES_AND_TRANSFORMATIONS", "path": "04_BUSINESS_RULES_AND_TRANSFORMATIONS.md", "required_sections": ["Business Rules"]},
    {"id": "05_RUNTIME_CONFIG_AND_EXTERNALS", "path": "05_RUNTIME_CONFIG_AND_EXTERNALS.md", "required_sections": ["Runtime Configuration"]},
    {"id": "06_OPERATIONS_TESTING_AND_DEBUGGING", "path": "06_OPERATIONS_TESTING_AND_DEBUGGING.md", "required_sections": ["Operations"]},
    {"id": "07_QUALITY_SECURITY_RISK_SCORECARD", "path": "07_QUALITY_SECURITY_RISK_SCORECARD.md", "required_sections": ["Risks"]},
    {"id": "08_CHANGE_PLAYBOOK", "path": "08_CHANGE_PLAYBOOK.md", "required_sections": ["Change Playbook"]},
    {"id": "09_EXECUTIVE_SUMMARY", "path": "09_EXECUTIVE_SUMMARY.md", "required_sections": ["Executive Summary"]}
  ],
  "task_templates": [
    {"id": "evidence", "task_type": "evidence_profile", "role": "writer", "prompt_ref": "prompts/evidence.md", "output_ids": ["evidence_profile"], "validators": ["source-citation-resolution"]},
    {"id": "analysis", "task_type": "analysis", "role": "writer", "prompt_ref": "prompts/analysis.md", "output_ids": ["analysis"], "depends_on": ["evidence"], "dependency_output_refs": ["evidence_profile"], "validators": ["source-citation-resolution"]},
    {"id": "document", "task_type": "synthesis", "role": "writer", "prompt_ref": "prompts/document.md", "output_ids": ["00_AGENT_BRIEF", "01_ARCHITECTURE_MAP", "02_COMPONENT_INVENTORY", "03_DATA_FLOWS_AND_LINEAGE", "04_BUSINESS_RULES_AND_TRANSFORMATIONS", "05_RUNTIME_CONFIG_AND_EXTERNALS", "06_OPERATIONS_TESTING_AND_DEBUGGING", "07_QUALITY_SECURITY_RISK_SCORECARD", "08_CHANGE_PLAYBOOK", "09_EXECUTIVE_SUMMARY"], "depends_on": ["analysis"], "dependency_output_refs": ["analysis"], "for_each": "outputs", "validators": ["markdown-structure", "source-citation-resolution"]}
  ]
}
