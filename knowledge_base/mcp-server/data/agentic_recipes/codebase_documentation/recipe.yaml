{
  "id": "codebase-documentation",
  "version": "1.0.0",
  "schema_version": 1,
  "certification_id": "bundled:nexus:codebase-documentation:1.0.0",
  "source_requirements": [
    {"source_role": "implementation", "required_capabilities": ["searchable_text", "structured_records"]},
    {"source_role": "legacy_baseline", "required_capabilities": ["documentation", "metrics"], "optional": true}
  ],
  "default_scope": {
    "required_capabilities": ["searchable_text"],
    "budgets": {"max_source_items": 1000, "max_evidence_items": 10000, "max_bytes": 104857600, "max_input_tokens": 900000, "max_tool_calls": 25, "max_elapsed_seconds": 3600},
    "unknown_policy": "disclose"
  },
  "roles": ["writer"],
  "required_model_capabilities": ["tools"],
  "allowed_tools": ["nexus_experiment_get_contract", "nexus_experiment_list_evidence", "nexus_experiment_search_evidence", "nexus_experiment_read_evidence", "nexus_experiment_traverse_relationships", "nexus_experiment_write_artifact", "nexus_experiment_submit_task"],
  "budgets": {"max_nodes": 25, "max_depth": 4, "max_fanout": 10, "max_attempts": 2, "max_concurrency": 4},
  "validators": ["markdown-structure", "source-citation-resolution"],
  "quality_gates": ["required-output-completeness", "no-unsupported-claims"],
  "output_contracts": [
    {"id": "evidence_profile", "path": "receipts/evidence_profile.json", "media_type": "application/json"},
    {"id": "analysis", "path": "receipts/analysis.json", "media_type": "application/json"},
    {"id": "00_AGENT_BRIEF", "path": "00_AGENT_BRIEF.md", "required_sections": ["Purpose"]},
    {"id": "01_ARCHITECTURE_MAP", "path": "01_ARCHITECTURE_MAP.md", "required_sections": ["Architecture"]},
    {"id": "02_COMPONENT_INVENTORY", "path": "02_COMPONENT_INVENTORY.md", "required_sections": ["Components"]},
    {"id": "03_DATA_FLOWS_AND_LINEAGE", "path": "03_DATA_FLOWS_AND_LINEAGE.md", "required_sections": ["Data Flows"]},
    {"id": "04_BUSINESS_RULES_AND_TRANSFORMATIONS", "path": "04_BUSINESS_RULES_AND_TRANSFORMATIONS.md", "required_sections": ["Business Rules"]},
    {"id": "05_RUNTIME_CONFIG_AND_EXTERNALS", "path": "05_RUNTIME_CONFIG_AND_EXTERNALS.md", "required_sections": ["Runtime Configuration"]},
    {"id": "06_OPERATIONS_TESTING_AND_DEBUGGING", "path": "06_OPERATIONS_TESTING_AND_DEBUGGING.md", "required_sections": ["Operations"]},
    {"id": "07_QUALITY_SECURITY_RISK_SCORECARD", "path": "07_QUALITY_SECURITY_RISK_SCORECARD.md", "required_sections": ["Risks"]},
    {"id": "08_CHANGE_PLAYBOOK", "path": "08_CHANGE_PLAYBOOK.md", "required_sections": ["Change Playbook"]},
    {"id": "09_EXECUTIVE_SUMMARY", "path": "09_EXECUTIVE_SUMMARY.md", "required_sections": ["Executive Summary"]}
  ],
  "task_templates": [
    {"id": "evidence", "task_type": "evidence_profile", "role": "writer", "prompt_ref": "prompts/evidence.md", "output_ids": ["evidence_profile"], "validators": ["source-citation-resolution"]},
    {"id": "analysis", "task_type": "analysis", "role": "writer", "prompt_ref": "prompts/analysis.md", "output_ids": ["analysis"], "depends_on": ["evidence"], "dependency_output_refs": ["evidence_profile"], "validators": ["source-citation-resolution"]},
    {"id": "document", "task_type": "synthesis", "role": "writer", "prompt_ref": "prompts/document.md", "output_ids": ["00_AGENT_BRIEF", "01_ARCHITECTURE_MAP", "02_COMPONENT_INVENTORY", "03_DATA_FLOWS_AND_LINEAGE", "04_BUSINESS_RULES_AND_TRANSFORMATIONS", "05_RUNTIME_CONFIG_AND_EXTERNALS", "06_OPERATIONS_TESTING_AND_DEBUGGING", "07_QUALITY_SECURITY_RISK_SCORECARD", "08_CHANGE_PLAYBOOK", "09_EXECUTIVE_SUMMARY"], "depends_on": ["analysis"], "dependency_output_refs": ["analysis"], "for_each": "outputs", "validators": ["markdown-structure", "source-citation-resolution"]}
  ]
}
