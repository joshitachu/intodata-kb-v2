[project]
name = "mcp-server"
version = "0.1.0"
description = "intodoc MCP Server + REST API for code intelligence orchestration"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0,<2.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "httpx>=0.27.0",
    "openai>=1.0.0",
    "anthropic>=0.40.0",
    "google-genai>=1.0.0",
    "rich>=13.0.0",
    "python-multipart>=0.0.9",
    "sse-starlette>=2.0.0",
    "markdown>=3.6.0",
    "weasyprint>=62.0",
    "jinja2>=3.1.0",
    "python-jose[cryptography]>=3.3.0",
    "alembic>=1.13.0",
    "ollama>=0.4.0",
    "json-repair>=0.30",
    "pypdf>=4.0.0",
    "xlrd>=2.0.1",
]

[project.optional-dependencies]
openai-agents = ["openai-agents==0.19.3"]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "aiosqlite>=0.20.0",
    "httpx>=0.27.0",
    "ruff>=0.8.0",
    "xlwt>=1.3.0",
]
hindsight = ["hindsight-client>=0.1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_server"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: end-to-end tests that exercise real plugin packs with mocked providers",
]

[tool.ruff]
line-length = 100
target-version = "py311"
