# Migrated to the One Pack v2 manifest format (schema_version: 2).
# Execution surface (docs, steps, phases, evidence profiles, gates) is
# unchanged; the v2 loader preserves v1 semantics for these fields.
schema_version: 2
id: intodata.webhook-smoke-test
layer: foundation
governance:
  owner: intodata
  scope: global
  provenance: intodata-packs
name: webhook-smoke-test
version: "1.0.0"
description: >
  Minimal one-document pack for webhook testing. Produces a tiny smoke-test
  document so repository webhook flows can be validated without spending many
  tokens on full documentation.

docs:
  - name: WEBHOOK_SMOKE_TEST
    evidence_profile: webhook
    sections:
      - Repository Snapshot
      - Detected Change Summary
      - Smoke Test Result
    required_evidence:
      - source_summary
    required_outputs:
      - smoke_test_result

evidence_profiles:
  webhook:
    include:
      - source_summary
      - routes
      - handlers
    exclude:
      - binary
      - static_assets
      - generated_files

validation:
  unknown_policy: explicit
  mode: blocking

quality_gates:
  mode: blocking
  required_sections:
    WEBHOOK_SMOKE_TEST:
      - Repository Snapshot
      - Detected Change Summary
      - Smoke Test Result
  required_terms:
    - scanned
    - webhook
    - PASS
  min_doc_bytes:
    WEBHOOK_SMOKE_TEST: 300

steps:
  - id: full_pipeline
    type: harness
