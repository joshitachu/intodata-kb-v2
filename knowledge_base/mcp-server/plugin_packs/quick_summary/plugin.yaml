# Migrated to the One Pack v2 manifest format (schema_version: 2).
# Execution surface (docs, steps, phases, evidence profiles, gates) is
# unchanged; the v2 loader preserves v1 semantics for these fields.
schema_version: 2
id: intodata.quick-summary
layer: foundation
governance:
  owner: intodata
  scope: global
  provenance: intodata-packs
name: quick-summary
version: "1.0.0"
description: >
  Minimal one-document pack for testing. Produces a single EXECUTIVE_SUMMARY
  document instead of the full 9-doc set.

docs:
  - name: EXECUTIVE_SUMMARY
    sections:
      - Overview
      - Key Integrations
      - Risks and Recommendations

steps:
  - id: full_pipeline
    type: harness
