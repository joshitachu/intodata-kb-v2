# Talend file classification rules
# Pattern → FileType mapping

rules:
  # Process jobs (the core integration logic)
  - pattern: "process/**/*.item"
    type: job
    description: "Talend job definition (XML/XMI with components, connections, context)"

  - pattern: "process/**/*.properties"
    type: job_properties
    description: "Job metadata sidecar (name, author, version, timestamps)"

  # Metadata connections (database/file/cloud connections)
  - pattern: "metadata/connections/*.item"
    type: connection
    description: "Database or external system connection definition"

  - pattern: "metadata/connections/*.properties"
    type: config
    description: "Connection metadata properties"

  # Context files (environment-specific variables)
  - pattern: "context/*.item"
    type: context
    description: "Context group with per-environment variable values"

  - pattern: "context/*.properties"
    type: config
    description: "Context metadata properties"

  # Code routines (Java source files stored as .item)
  - pattern: "code/routines/**/*.item"
    type: routine
    description: "Java routine source code"

  - pattern: "code/routines/**/*.properties"
    type: config
    description: "Routine metadata properties"

  # Routes (ESB/Camel designs -- same serialized format as a Job)
  - pattern: "routes/**/*.item"
    type: job
    description: "Talend Route design (artifact_kind=route)"

  - pattern: "routes/**/*.properties"
    type: job_properties
    description: "Route metadata sidecar"

  # Joblets / Routelets (reusable fragments)
  - pattern: "joblets/**/*.item"
    type: joblet
    description: "Reusable joblet definition"

  - pattern: "routelets/**/*.item"
    type: joblet
    description: "Reusable routelet definition"

  - pattern: "joblets/**/*.properties"
    type: job_properties
    description: "Joblet metadata sidecar"

  - pattern: "routelets/**/*.properties"
    type: job_properties
    description: "Routelet metadata sidecar"

  # SQL patterns
  - pattern: "sqlPatterns/**/*"
    type: sql_pattern
    description: "SQL pattern template"

  # Documentation
  - pattern: "documentations/**/*"
    type: documentation
    description: "Project documentation"

  # Talend Data Mapper (TDM) maps and the structures they map between
  - pattern: "Maps/**/*.xml"
    type: tdm_map
    description: "Talend Data Mapper map definition (input/output tree + expressions)"

  - pattern: "Structures/**/*.xml"
    type: structure
    description: "Talend Data Mapper structure (element tree schema)"

  - pattern: "Namespace Containers/*.xml"
    type: namespace
    description: "TDM namespace container"

  # XSLT transforms, wherever a route or job stores them
  - pattern: "**/*.xsl"
    type: xslt
    description: "XSLT stylesheet referenced from a route/job component"

  - pattern: "**/*.xslt"
    type: xslt
    description: "XSLT stylesheet referenced from a route/job component"

  # ESB services
  - pattern: "services/**/*.item"
    type: service
    description: "Talend ESB service design"

  - pattern: "**/*.wsdl"
    type: wsdl
    description: "SOAP service contract"

  # Project descriptor
  - pattern: "talend.project"
    type: project
    description: "Talend project descriptor (label, technical label, id)"

  # Route/job support payloads that are inventoried but not parsed
  - pattern: "route_resources/**/*"
    type: resource
    description: "Route resource payload (schema, sample, jar)"

  - pattern: "resources/**/*"
    type: resource
    description: "Job/route resource payload (schema, sample, jar)"

# File extensions to always skip
skip_extensions:
  - ".screenshot"
  - ".bmp"
  - ".png"
  - ".jpg"
  - ".jpeg"
  - ".gif"

# Directories to always skip
skip_directories:
  - "recycle_bin"
  - ".git"
  - ".settings"
