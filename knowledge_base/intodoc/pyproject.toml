[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "intodoc"
version = "0.1.0"
description = "Integration Documentation Generator — scan integration codebases and generate structured documentation via LLM analysis"
readme = "CLAUDE.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "click>=8.1",
    "litellm>=1.40",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "jinja2>=3.1",
    "rich>=13.0",
    "pathspec>=0.12",
    "gitpython>=3.1",
    "weasyprint>=62.0",
    "requests>=2.31",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[project.scripts]
intodoc = "intodoc.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/intodoc"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
