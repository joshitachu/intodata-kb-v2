server {
    listen 8001;
    client_max_body_size 3072M;

    # Use Docker's embedded DNS so nginx re-resolves service hostnames on
    # each request instead of caching IPs at startup. Without this, restarting
    # any upstream container causes 502s until dashboard is also restarted.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # API routes - proxy to MCP server in the compose network
    location /mcp/ {
        set $upstream_mcp http://mcp-server:8002;
        proxy_pass $upstream_mcp;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;

        # SSE streaming for deep-dive analysis
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
    }
    # Mission Control — proxy to mission-control container.
    # Authorization header is injected here; the key never reaches the browser.
    # Because this location adds the key, it only answers requests addressed to
    # localhost/127.0.0.1 (the port is loopback-bound). Other containers calling
    # dashboard:8001/mc/ and DNS-rebinding pages (Host: attacker domain) get 403.
    # The Vite dev proxy (vite.config.ts) talks to mission-control directly and
    # is unaffected.
    location /mc/ {
        if ($host !~* "^(localhost|127\.0\.0\.1)$") {
            return 403;
        }
        set $upstream_mc http://mission-control:9100;
        rewrite ^/mc/(.*)$ /$1 break;
        proxy_pass $upstream_mc;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization "Bearer ${MC_API_KEY}";
    }

    location /health {
        set $upstream_mcp http://mcp-server:8002;
        proxy_pass $upstream_mcp;
        proxy_set_header Cookie $http_cookie;
    }
    location /webhook/ {
        set $upstream_mcp http://mcp-server:8002;
        proxy_pass $upstream_mcp;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /logs/ {
        set $upstream_mcp http://mcp-server:8002;
        proxy_pass $upstream_mcp;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;

        # SSE streaming requires no buffering
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
    }

    # Auth proxy — forward auth requests to RAG backend so dashboard
    # can verify JWT without cross-origin issues
    location /auth/ {
        set $upstream_backend http://backend:8000;
        rewrite ^/auth/(.*)$ /api/v1/auth/$1 break;
        proxy_pass $upstream_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
    }

    # Nexus harness API routes - expose the backend's /api/v1 prefix to the dashboard.
    location /nexus-api/ {
        set $upstream_backend http://backend:8000;
        rewrite ^/nexus-api/(.*)$ /api/v1/$1 break;
        proxy_pass $upstream_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
    }

    # Hashed Vite assets — content-addressed filenames, safe to cache forever.
    # When content changes the hash changes, so a fresh index.html (see no-cache
    # below) always points clients to the new bundle.
    location /assets/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Dashboard static files (Vite builds with base: /dashboard/)
    location /dashboard/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
