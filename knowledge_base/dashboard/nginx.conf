server {
    listen 8001;
    client_max_body_size 500M;

    # API routes - proxy to MCP server in the compose network
    location /mcp/ {
        proxy_pass http://mcp-server:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;

        # SSE streaming for deep-dive analysis
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
    }
    # Mission Control — proxy to mission-control container.
    # Authorization header is injected here; the key never reaches the browser.
    location /mc/ {
        proxy_pass http://mission-control:9100/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization "Bearer ${MC_API_KEY}";
    }

    location /health {
        proxy_pass http://mcp-server:8002;
        proxy_set_header Cookie $http_cookie;
    }
    location /webhook/ {
        proxy_pass http://mcp-server:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /logs/ {
        proxy_pass http://mcp-server:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;

        # SSE streaming requires no buffering
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
    }

    # Auth proxy — forward auth requests to RAG backend so dashboard
    # can verify JWT without cross-origin issues
    location /auth/ {
        proxy_pass http://backend:8000/api/v1/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
    }

    # Dashboard static files (Vite builds with base: /dashboard/)
    location /dashboard/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /index.html;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
