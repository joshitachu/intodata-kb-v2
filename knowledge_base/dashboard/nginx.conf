server {
    listen 8001;
    client_max_body_size 500M;

    # Use Docker's embedded DNS so nginx re-resolves service hostnames on
    # each request instead of caching IPs at startup. Without this, restarting
    # any upstream container causes 502s until dashboard is also restarted.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # API routes - proxy to MCP server in the compose network
    location /mcp/ {
        set $upstream_mcp http://mcp-server:8002;
        proxy_pass $upstream_mcp;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;

        # SSE streaming for deep-dive analysis
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
    }
    # Mission Control — proxy to mission-control container.
    # Authorization header is injected here; the key never reaches the browser.
    location /mc/ {
        set $upstream_mc http://mission-control:9100;
        rewrite ^/mc/(.*)$ /$1 break;
        proxy_pass $upstream_mc;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization "Bearer ${MC_API_KEY}";
    }

    location /health {
        set $upstream_mcp http://mcp-server:8002;
        proxy_pass $upstream_mcp;
        proxy_set_header Cookie $http_cookie;
    }
    location /webhook/ {
        set $upstream_mcp http://mcp-server:8002;
        proxy_pass $upstream_mcp;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /logs/ {
        set $upstream_mcp http://mcp-server:8002;
        proxy_pass $upstream_mcp;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;

        # SSE streaming requires no buffering
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
    }

    # Auth proxy — forward auth requests to RAG backend so dashboard
    # can verify JWT without cross-origin issues
    location /auth/ {
        set $upstream_backend http://backend:8000;
        rewrite ^/auth/(.*)$ /api/v1/auth/$1 break;
        proxy_pass $upstream_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
    }

    # Dashboard static files (Vite builds with base: /dashboard/)
    location /dashboard/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /index.html;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
